name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Skip Dependabot PRs — they only modify lockfiles and never introduce
    # secrets, so the gitleaks scan is pure noise (and Dependabot runs can't
    # access repo secrets without an extra Dependabot-secrets entry).
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks detect
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  python:
    name: Lint + test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        run: mise install

      - name: Install Python dependencies
        run: python -m pip install -q -r requirements.txt

      # Pin ruff to the version the codebase is currently compliant
      # with. requirements-dev.txt pins the version dependabot bumps
      # to, but the codebase may be ahead of the pin (e.g. when this
      # PR is preparing for an incoming dependabot ruff bump). The
      # dev-dependency pin catches up when the bump lands.
      - name: Install pinned ruff
        run: python -m pip install -q -U 'ruff==0.17.0'

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: Pytest
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: python -m pytest tests/ --ignore=tests/test_shim.py -v

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    # Issue #126: every per-cloud stack (aws/dev, aws/prod,
    # aws/bootstrap, alicloud/dev, alicloud/prod, alicloud/bootstrap)
    # gets `terraform init -backend=false && terraform validate`. The
    # matrix enumerates them all so a future cloud (e.g. Azure) just
    # adds an entry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: infra/aws/dev
            provider: aws
          - dir: infra/aws/prod
            provider: aws
          - dir: infra/aws/bootstrap
            provider: aws
          - dir: infra/alicloud/dev
            provider: alicloud
          - dir: infra/alicloud/prod
            provider: alicloud
          - dir: infra/alicloud/bootstrap
            provider: alicloud
    steps:
      - uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: terraform fmt (recursive)
        run: terraform fmt -check -recursive

      - name: terraform init (backend disabled, ${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false

      - name: terraform validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: terraform validate