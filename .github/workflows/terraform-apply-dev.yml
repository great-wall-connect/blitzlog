name: terraform-apply-dev

# Manual workflow to apply infra/dev without going through the
# full release cycle (release.yml takes ~35 min for the image
# build + Packer bake; this workflow is a ~3-5 min terraform-only
# path). Use this when:
#
#   - You changed only infra/aws/dev/* (e.g. tfvars, module code, IAM
#     policy) and don't need a new image baked.
#   - You want to verify a feature branch's infra changes against
#     a real AWS account before merging.
#   - You rotated a secret (TF_VAR_*) and want to push the new
#     value into the dev Lambda's environment without a release.
#
# Triggers: workflow_dispatch only. No auto-apply on push or PR.
#
# Prod is NOT exposed here — prod applies are part of the
# canonical release cycle (.github/workflows/release.yml in
# release mode) and require CODEOWNERS approval via the
# `production` GitHub Environment. The manual dev path is the
# fast-feedback escape hatch for non-prod work.
#
# Concurrency: group `terraform-dev` serializes CI runs
# (cancel-in-progress: false) so a long apply blocks the next
# one rather than racing it. Local-vs-CI races remain possible
# (the project chose no DynamoDB lock table; see
# README.md:295-307).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to apply from. Defaults to `github.ref_name` (the branch the workflow was triggered from)."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  apply-dev:
    name: Apply terraform (dev)
    runs-on: ubuntu-26.04
    # 20 min covers a typical plan + apply + local-exec (Python 3.12
    # venv + pip install for the lambda bundle, see
    # infra/aws/modules/core/lambda.tf:35-92). The local-exec is the
    # slow step on cold caches; subsequent runs reuse the venv
    # and finish in <5 min.
    timeout-minutes: 20
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    env:
      BLITZLOG_ENV: dev
      # Issue #126: BLITZLOG_PROVIDER selects the per-cloud tree, the
      # same way the release workflow's deploy job does.
      BLITZLOG_PROVIDER: ${{ vars.BLITZLOG_PROVIDER || 'aws' }}
      # Issue #191: the state key moved to the shared
      # `blitzlog/<env>.tfstate` layout (same key on both clouds).
      STATE_KEY: blitzlog/dev.tfstate
      AWS_REGION: ap-east-1
      # Default to the workflow's ref_name when the operator
      # leaves the input blank (typical when dispatched from
      # the GitHub UI on a feature branch).
      BUILD_REF: ${{ inputs.ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          # fetch-depth: 0 keeps git history available for
          # `null_resource.lambda_build`'s filemd5 triggers
          # (infra/aws/modules/core/lambda.tf:35-92) and matches
          # the `terraform_data` provisioner behavior.
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        # The local-exec in null_resource.lambda_build resolves
        # Python 3.12 from `~/.local/share/mise/installs/python/...`
        # (see infra/aws/modules/core/lambda.tf:65-75). mise.toml pins
        # python = "3.12", so `mise install` puts it there.
        run: mise install

      # Build the Lambda bundle into `infra/aws/modules/core/build/`
      # BEFORE `terraform plan` runs. The data source
      # `module.core.data.archive_file.lambda_zip` (lambda.tf:1-7)
      # reads that directory at plan time to compute
      # `output_base64sha256`, and fails with
      # "could not archive missing directory" if the dir is
      # absent. The null_resource.lambda_build local-exec only
      # runs on `terraform apply`, so the dir doesn't exist on a
      # fresh runner by the time plan runs. The release job above
      # builds into `infra/build/` (the release asset path), not
      # `infra/aws/modules/core/build/`, so we can't share artifacts
      # between the two jobs.
      #
      # This command mirrors the local-exec in
      # `infra/aws/modules/core/lambda.tf` and uses the same
      # Python-resolution ladder (mise → system python3.12 → fail
      # loudly) plus the same `--without-pip` + get-pip.py bootstrap
      # so the build never depends on `ensurepip._bundled`. See the
      # lambda.tf `local-exec` comment block for the rationale.
      - name: Pre-build Lambda bundle
        env:
          BLITZLOG_PROVIDER: ${{ env.BLITZLOG_PROVIDER }}
          # Issue #125: the per-cloud requirements file. The AWS
          # bundle must NOT ship the alibaba SDKs and the Alicloud
          # bundle must NOT ship boto3's AWS-only extras.
          LAMBDA_REQUIREMENTS_FILE: ${{ env.BLITZLOG_PROVIDER == 'alicloud' && 'requirements-alicloud.txt' || 'requirements-aws.txt' }}
          BUILD_DIR: ${{ env.BLITZLOG_PROVIDER == 'alicloud' && 'infra/alicloud/modules/core/build' || 'infra/aws/modules/core/build' }}
        run: |
          set -euo pipefail
          PYTHON_BIN=""
          if [ -d "$HOME/.local/share/mise/installs/python" ]; then
            PYTHON_BIN="$(ls -d "$HOME/.local/share/mise/installs/python"/3.12.*/bin/python3 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$PYTHON_BIN" ]; then
            PYTHON_BIN="$(command -v python3.12 || true)"
          fi
          if [ -z "$PYTHON_BIN" ] || [ ! -x "$PYTHON_BIN" ]; then
            echo "FATAL: Python 3.12 not found. Install via 'mise install' or 'apt install python3.12'." >&2
            exit 1
          fi
          MODULE_DIR="infra/${BLITZLOG_PROVIDER}/modules/core"
          BUILD_DIR="${MODULE_DIR}/build"
          VENV_DIR="${MODULE_DIR}/.build-venv"
          rm -rf "$BUILD_DIR" "$VENV_DIR"
          mkdir -p "$BUILD_DIR"
          cp -r lambda "$BUILD_DIR"/
          mkdir -p "$BUILD_DIR/lambda/packages/whisper-stt-shim"
          cp packages/whisper-stt-shim/server.py "$BUILD_DIR/lambda/packages/whisper-stt-shim/"
          "$PYTHON_BIN" -m venv --without-pip "$VENV_DIR"
          curl -sS https://bootstrap.pypa.io/get-pip.py | "$VENV_DIR/bin/python3"
          # ${LAMBDA_REQUIREMENTS_FILE:-requirements-aws.txt} lets the
          # Alicloud job flip this to requirements-alicloud.txt without
          # touching the script body. The alibaba SDKs (oss2,
          # alibabacloud_oos20190601, alibabacloud_ecs20140526) belong
          # to requirements-alicloud.txt and are NOT shipped to the AWS
          # deploy.
          "$VENV_DIR/bin/pip" install --no-cache-dir -r "lambda/${LAMBDA_REQUIREMENTS_FILE:-requirements-aws.txt}" -t "$BUILD_DIR"
          rm -rf "$VENV_DIR"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Configure AWS credentials (OIDC) for terraform
        if: env.BLITZLOG_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # OIDC into the role provisioned by infra/aws/bootstrap/
          # deploy-role.tf. The same repo variable (`AWS_ACCOUNT_ID`)
          # is used by the Packer workflow in release.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/blitzlog-deploy-role
          aws-region: ap-east-1

      # Fetch per-env deploy config + secrets from SSM Parameter
      # Store. The deploy role (infra/aws/bootstrap/deploy-role.tf)
      # has `ssm:GetParametersByPath` on /blitzlog/<env>/*, so the
      # OIDC session can read these. We fetch the entire dev
      # subtree in one round trip (cheaper + atomic) and map
      # each parameter's leaf name to a TF_VAR_<name> env var
      # (hyphens -> underscores).
      #
      # The values are written to GITHUB_ENV using the heredoc
      # form so multi-line PEM private keys survive intact. The
      # values never touch the runner's filesystem, and they
      # never enter the GH Actions secret context (so PRs from
      # forks on this public repo can't read them).
      #
      # Placeholder detection: every parameter was provisioned
      # by infra/aws/bootstrap/secrets.tf with
      # value=PLACEHOLDER_SET_VIA_AWS_CLI; the bootstrap
      # `lifecycle.ignore_changes=[value]` keeps the operator's
      # real value intact across subsequent applies. The sanity
      # check below fails fast if any value still equals the
      # placeholder, so a misconfigured operator gets a clear
      # one-time-setup error rather than a confusing
      # "GitHub App auth failed" deep inside the Lambda at
      # runtime.
      - name: Render TF_VAR_* env from SSM
        if: env.BLITZLOG_PROVIDER == 'aws'
        env:
          BLITZLOG_ENV: dev
        run: |
          set -euo pipefail

          SSM_PATH="/blitzlog/${BLITZLOG_ENV}/"
          aws ssm get-parameters-by-path \
            --path "${SSM_PATH}" \
            --recursive \
            --with-decryption \
            --output json > /tmp/ssm-params.json

          # Fail fast if any required parameter is missing
          # entirely (operator hasn't run the bootstrap apply,
          # or added a TF var to variables.tf without adding the
          # corresponding SSM parameter to secrets.tf).
          for required in \
            aws-region vpc-id github-app-id \
            github-app-private-key github-app-installation-id \
            github-webhook-secret opencode-api-key \
            agent-logs-bucket-name; do
            if ! jq -e --arg n "${SSM_PATH}${required}" \
                 '.Parameters[] | select(.Name == $n)' /tmp/ssm-params.json > /dev/null; then
              echo "FATAL: ${SSM_PATH}${required} is not set in SSM" >&2
              echo "  Run 'cd infra/bootstrap && terraform apply' first," >&2
              echo "  then update the placeholder with:" >&2
              echo "    aws ssm put-parameter --name ${SSM_PATH}${required} --type SecureString --value <real> --overwrite" >&2
              exit 1
            fi
          done

          # Fail fast if any value is still the bootstrap
          # placeholder (operator hasn't replaced it yet).
          if placeholders=$(jq -r '.Parameters[] | select(.Value == "PLACEHOLDER_SET_VIA_AWS_CLI") | .Name' /tmp/ssm-params.json); [ -n "$placeholders" ]; then
            echo "FATAL: the following SSM parameters still have the bootstrap placeholder value:" >&2
            echo "$placeholders" | sed 's/^/  /' >&2
            echo "" >&2
            echo "  Update each one with the real value via:" >&2
            echo "    aws ssm put-parameter --name <name> --type SecureString --value <real> --overwrite" >&2
            echo "  See README §One-time operator setup for the full list." >&2
            exit 1
          fi

          # Render each parameter to GITHUB_ENV in heredoc form.
          # The mapping is:
          #   /blitzlog/<env>/github-app-private-key  ->  TF_VAR_github_app_private_key
          # (leaf name with hyphens replaced by underscores).
          # Heredoc form preserves multi-line PEM values.
          jq -r '
            .Parameters[] |
            (.Name | split("/") | last) as $leaf |
            "TF_VAR_" + ($leaf | gsub("-";"_")) + "<<EOF\n" + .Value + "\nEOF"
          ' /tmp/ssm-params.json >> "$GITHUB_ENV"

      # --- Alicloud leg -----------------------------------------------------
      # Issue #126: the Alicloud dev stack is applied by the same
      # workflow when vars.BLITZLOG_PROVIDER selects it. The steps are
      # the ones the release workflow's deploy job runs (so the two
      # paths cannot drift), minus the parts that need the release
      # job's outputs.
      - name: Configure Alicloud credentials (OIDC) for terraform
        if: env.BLITZLOG_PROVIDER == 'alicloud'
        id: aliyun-credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: acs:ram::${{ vars.ALICLOUD_ACCOUNT_ID }}:oidc-provider/blitzlog
          role-to-assume: acs:ram::${{ vars.ALICLOUD_ACCOUNT_ID }}:role/blitzlog-deploy-role
          audience: sts.aliyuncs.com
      - name: Export Alicloud credentials for the provider and the OSS backend
        if: env.BLITZLOG_PROVIDER == 'alicloud'
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-id }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-secret }}
          ALIYUN_SECURITY_TOKEN: ${{ steps.aliyun-credentials.outputs.aliyun-security-token }}
        run: |
          set -euo pipefail
          if [ -z "${ALIYUN_ACCESS_KEY_ID:-}" ]; then
            echo "FATAL: the Alicloud OIDC step produced no credentials." >&2
            echo "  Check that vars.ALICLOUD_ACCOUNT_ID is set and that the" >&2
            echo "  Alicloud OIDC provider + blitzlog-deploy-role exist." >&2
            exit 1
          fi
          {
            echo "ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}"
            echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}"
            echo "ALIBABA_CLOUD_SECURITY_TOKEN=${ALIYUN_SECURITY_TOKEN}"
            echo "ALICLOUD_ACCESS_KEY=${ALIYUN_ACCESS_KEY_ID}"
            echo "ALICLOUD_SECRET_KEY=${ALIYUN_ACCESS_KEY_SECRET}"
            echo "ALICLOUD_SECURITY_TOKEN=${ALIYUN_SECURITY_TOKEN}"
          } >> "$GITHUB_ENV"

          # The aliyun CLI does NOT read the ALIBABA_CLOUD_*
          # environment variables for authentication — it needs a
          # profile file, and for STS credentials that profile must be
          # in "StsToken" mode (an "AK" profile drops the token and the
          # API rejects the request with MissingSecurityToken). The
          # step below reads the OOS parameters with the CLI, so
          # without this profile every read fails and the step reports
          # the parameter as "missing or empty" — which it is not.
          mkdir -p "$HOME/.aliyun"
          ALIYUN_ACCESS_KEY_ID="$ALIYUN_ACCESS_KEY_ID" \
          ALIYUN_ACCESS_KEY_SECRET="$ALIYUN_ACCESS_KEY_SECRET" \
          ALIYUN_SECURITY_TOKEN="$ALIYUN_SECURITY_TOKEN" \
          ALICLOUD_REGION="${{ vars.ALICLOUD_REGION || 'cn-hongkong' }}" \
          python3 - <<'PY'
          import json
          import os
          profile = {
              "name": "default",
              "mode": "StsToken",
              "access_key_id": os.environ["ALIYUN_ACCESS_KEY_ID"],
              "access_key_secret": os.environ["ALIYUN_ACCESS_KEY_SECRET"],
              "sts_token": os.environ["ALIYUN_SECURITY_TOKEN"],
              "region_id": os.environ["ALICLOUD_REGION"],
              "output_format": "json",
              "language": "en",
          }
          path = os.path.expanduser("~/.aliyun/config.json")
          with open(path, "w", encoding="utf-8") as fh:
              json.dump({"current": "default", "profiles": [profile], "meta_path": ""}, fh)
          os.chmod(path, 0o600)
          PY

      # Fetch per-env deploy config + secrets from SSM Parameter
      # Store. The deploy role (infra/aws/bootstrap/deploy-role.tf)
      # has `ssm:GetParametersByPath` on /blitzlog/<env>/*, so the
      # OIDC session can read these. We fetch the entire env
      # subtree in one round trip (cheaper + atomic) and map
      # each parameter's leaf name to a TF_VAR_<name> env var
      # (hyphens -> underscores).
      #
      # The values are written to GITHUB_ENV using the heredoc
      # form so multi-line PEM private keys survive intact. The
      # values never touch the runner's filesystem, and they
      # never enter the GH Actions secret context (so PRs from
      # forks on this public repo can't read them).
      #
      # Placeholder detection: every parameter was provisioned
      # by infra/aws/bootstrap/secrets.tf with
      # value=PLACEHOLDER_SET_VIA_AWS_CLI; the bootstrap
      # `lifecycle.ignore_changes=[value]` keeps the operator's
      # real value intact across subsequent applies. The sanity
      # check below fails fast if any value still equals the
      # placeholder, so a misconfigured operator gets a clear
      # one-time-setup error rather than a confusing
      # "GitHub App auth failed" deep inside the Lambda at
      # runtime.
      #
      # Issue #126/#125: this step is AWS-only. The Alicloud path
      # gets its TF_VAR_* from the KMS Secrets Manager fetch below,
      # which is the direct analogue of this step — the Alicloud
      # `SecretStore` implementation IS KMS, and the secret paths
      # are byte-for-byte identical to the SSM paths
      # (/blitzlog/<env>/<service>/<name>), so the same
      # leaf-name → TF_VAR_<name> mapping works unchanged.
      - name: Render TF_VAR_* env from OOS
        if: env.BLITZLOG_PROVIDER == 'alicloud'
        env:
          BLITZLOG_ENV: ${{ env.BLITZLOG_ENV }}
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION || 'cn-hongkong' }}
          # The shared agent network (see the note further down).
          ALICLOUD_VPC_ID: ${{ vars.ALICLOUD_VPC_ID }}
          ALICLOUD_VSWITCH_IDS: ${{ vars.ALICLOUD_VSWITCH_IDS }}
        run: |
          set -euo pipefail

          # No leading slash: OOS parameter names are
          # `blitzlog/<env>/...` (see
          # infra/alicloud/modules/core/locals.tf).
          OOS_ROOT="blitzlog/${BLITZLOG_ENV}"

          # The `aliyun` CLI is not installed on the runner by
          # default. Install the same pinned build the baked host
          # image uses (infra/alicloud/packer/scripts-ecs-ubuntu/
          # 01-system.sh) so the two paths cannot drift.
          if ! command -v aliyun >/dev/null 2>&1; then
            cd /tmp
            curl -fsSL -o aliyun-cli.tgz \
              https://aliyuncli.alicdn.com/aliyun-cli-linux-3.5.4-amd64.tgz
            tar -xzf aliyun-cli.tgz
            sudo mv aliyun /usr/local/bin/aliyun
            sudo chmod +x /usr/local/bin/aliyun
            rm -f aliyun-cli.tgz
          fi

          # The secret names the core module provisions, mapped to
          # the TF variable each one feeds. The AWS-side list is the
          # same set of TF variables; see the SSM step above.
          #   github-app/id               -> github_app_id
          #   github-app/private-key      -> github_app_private_key
          #   github-app/installation-id  -> github_app_installation_id
          #   github-webhook/secret       -> github_webhook_secret
          #   opencode/api-key            -> opencode_api_key
          #   stt/api-key                 -> stt_api_key
          #   stt/model                   -> stt_model
          #   stt/language                -> stt_language
          #   stt/models-bucket           -> stt_models_bucket_name
          declare -a OOS_PARAMS=(
            "github-app/id"
            "github-app/private-key"
            "github-app/installation-id"
            "github-webhook/secret"
            "opencode/api-key"
            "stt/api-key"
            "stt/model"
            "stt/language"
            "stt/models-bucket"
          )

          for secret in "${OOS_PARAMS[@]}"; do
            name="${OOS_ROOT}/${secret}"
            value=$(aliyun oos GetSecretParameter \
              --Name "$name" \
              --WithDecryption true \
              --region "$ALICLOUD_REGION" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["Parameter"]["Value"], end="")' 2>/dev/null || true)
            if [ -z "$value" ]; then
              echo "FATAL: the OOS parameter ${name} is missing or empty." >&2
              echo "  Run 'cd infra/alicloud/dev && terraform apply' first to" >&2
              echo "  create the parameter, then set its real value with:" >&2
              echo "    aliyun oos UpdateSecretParameter --Name ${name} --Value <real> --region $ALICLOUD_REGION" >&2
              exit 1
            fi
            # The leaf name maps to the TF variable: the last
            # path segment with hyphens replaced by underscores,
            # EXCEPT for the two whose TF variable name differs from
            # the leaf (`github-app/id` -> github_app_id,
            # `github-app/private-key` -> github_app_private_key,
            # `github-app/installation-id` -> github_app_installation_id,
            # `github-webhook/secret` -> github_webhook_secret,
            # `opencode/api-key` -> opencode_api_key,
            # `stt/api-key` -> stt_api_key,
            # `stt/models-bucket` -> stt_models_bucket_name).
            case "$secret" in
              github-app/id)              var=github_app_id ;;
              github-app/private-key)     var=github_app_private_key ;;
              github-app/installation-id) var=github_app_installation_id ;;
              github-webhook/secret)      var=github_webhook_secret ;;
              opencode/api-key)           var=opencode_api_key ;;
              stt/api-key)                var=stt_api_key ;;
              stt/model)                  var=stt_model ;;
              stt/language)               var=stt_language ;;
              stt/models-bucket)          var=stt_models_bucket_name ;;
              *) echo "FATAL: unhandled OOS parameter ${secret}" >&2; exit 1 ;;
            esac
            # Heredoc form so multi-line PEM private keys survive.
            {
              echo "TF_VAR_${var}<<EOF"
              echo "$value"
              echo "EOF"
            } >> "$GITHUB_ENV"
          done

          # The OSS bucket names are not secrets — they are plain
          # TF variables the operator configures. They come from the
          # repo variables so the runner does not need a tfvars file.
          echo "TF_VAR_agent_logs_bucket_name=${ALICLOUD_AGENT_LOGS_BUCKET:-gwc-blitzlog-agent-logs}" >> "$GITHUB_ENV"
          echo "TF_VAR_alicloud_region=${ALICLOUD_REGION}" >> "$GITHUB_ENV"
          # The shared agent network. Alicloud has NO default VPC per
          # region, so the VPC + VSwitches are created by the
          # bootstrap stack (infra/alicloud/bootstrap/network.tf) and
          # the operator copies its outputs into these repo
          # variables:
          #
          #   cd infra/alicloud/bootstrap && terraform output vpc_id
          #   cd infra/alicloud/bootstrap && terraform output vswitch_ids
          #
          # Both are REQUIRED by the per-env stacks — an ECS launch
          # needs a VSwitch, and the launch fails without one.
          if [ -z "${ALICLOUD_VPC_ID:-}" ] || [ -z "${ALICLOUD_VSWITCH_IDS:-}" ]; then
            echo "FATAL: ALICLOUD_VPC_ID and ALICLOUD_VSWITCH_IDS must be set." >&2
            echo "  The Alicloud bootstrap stack owns the agent VPC + VSwitches." >&2
            echo "  Get them with:" >&2
            echo "    cd infra/alicloud/bootstrap && terraform output vpc_id" >&2
            echo "    cd infra/alicloud/bootstrap && terraform output vswitch_ids" >&2
            echo "  then set them as repo variables:" >&2
            echo "    gh variable set ALICLOUD_VPC_ID --body <vpc-id>" >&2
            echo "    gh variable set ALICLOUD_VSWITCH_IDS --body '<id1>,<id2>'" >&2
            exit 1
          fi
          echo "TF_VAR_vpc_id=${ALICLOUD_VPC_ID}" >> "$GITHUB_ENV"
          echo "TF_VAR_vswitch_ids=[\"${ALICLOUD_VSWITCH_IDS//,/\",\"}\"]" >> "$GITHUB_ENV"

      # Backend config is passed inline so no `*.hcl` file is
      # materialized on the runner. The bucket comes from the
      # repo variable TF_BACKEND_BUCKET (with a default of
      # `gwc-infra-tf-state` so the standard install needs no
      # operator action; the variable exists for non-default
      # state buckets), the key is per-env
      # (blitzlog/<env>.tfstate), the region is hard-coded
      # ap-east-1 (matches the bootstrap role's trust policy).
      #
      # Issue #126: when BLITZLOG_PROVIDER=alicloud, the backend
      # switches from AWS S3 to Alicloud OSS. The state bucket
      # name comes from vars.TF_BACKEND_BUCKET_OSS.
      #
      # Issue #125: the Alicloud defaults were corrected to the
      # REAL bucket + region. The state bucket `gwc-infra-tf-state`
      # (hyphen) lives in cn-hongkong — the previous default
      # (`gwc-infra-tfstate`, no hyphen, cn-hangzhou) named a
      # bucket that does not exist in a region that is not the
      # bucket's, which fails with "Authorization header is
      # invalid" rather than a clear "no such bucket". An OSS
      # bucket name is globally unique but its REGION is not, so
      # the region must match the bucket's.
      #
      # The Alicloud credentials come from the "Configure
      # Alicloud credentials" step above, which exports both the
      # ALIBABA_CLOUD_* (provider) and ALICLOUD_* (backend) env
      # var names.
      #
      # Issue #191: the OSS backend prepends its `prefix` (default
      # `env:`) to the key, so `key=blitzlog/dev.tfstate` would
      # resolve to `env:/blitzlog/dev.tfstate` — an object that does
      # not exist. `prefix=` (empty) pins the object path to the key
      # itself, which is the same layout the S3 backend uses.

      # Backend config is passed inline so no `*.hcl` file is
      # materialized on the runner. The bucket comes from the
      # repo variable TF_BACKEND_BUCKET (with a default of
      # `gwc-infra-tf-state` so the standard install needs no
      # operator action; the variable exists for non-default
      # state buckets), the key is `blitzlog/dev.tfstate`
      # to match infra/aws/prod/main.tf's backend handoff, the region
      # is hard-coded ap-east-1.
      - name: terraform init
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/dev
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET || 'gwc-infra-tf-state' }}
          TF_BACKEND_BUCKET_OSS: ${{ vars.TF_BACKEND_BUCKET_OSS || 'gwc-infra-tf-state' }}
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION || 'cn-hongkong' }}
          BLITZLOG_PROVIDER: ${{ env.BLITZLOG_PROVIDER }}
        run: |
          set -euo pipefail
          if [ "${BLITZLOG_PROVIDER}" = "alicloud" ]; then
            terraform init -input=false \
              -backend-config="bucket=${TF_BACKEND_BUCKET_OSS}" \
              -backend-config="key=${{ env.STATE_KEY }}" \
              -backend-config="prefix=" \
              -backend-config="region=${ALICLOUD_REGION}"
          else
            terraform init -input=false \
              -backend-config="bucket=${TF_BACKEND_BUCKET}" \
              -backend-config="key=${{ env.STATE_KEY }}" \
              -backend-config="region=ap-east-1"
          fi

      - name: terraform validate
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/dev
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/dev
        run: |
          set -euo pipefail
          # -out=tfplan serialises the plan to a file so the
          # apply step consumes the exact same plan (no drift
          # between plan and apply). -no-color keeps the log
          # readable in the GH Actions UI.
          terraform plan -no-color -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-dev
          path: infra/${{ env.BLITZLOG_PROVIDER }}/dev/tfplan
          # 14-day retention matches the release.yml deploy
          # path; the plan is a snapshot, not a long-lived
          # artifact.
          retention-days: 14

      - name: terraform apply
        id: apply
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/dev
        # Always consumes the plan from the previous step; never
        # re-plans in-band. Keeps plan↔apply symmetric so a
        # reviewer looking at the artifact can be sure the apply
        # matches what they saw.
        run: terraform apply -no-color -input=false tfplan

      - name: Capture terraform output
        if: steps.apply.outcome == 'success'
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/dev
        # `webhook_url` is the only output the operator needs
        # after a successful apply (it's the URL the GitHub App
        # webhook should target). Capture the full -json output
        # to the run summary so the operator can grep for any
        # other outputs without re-running plan/apply.
        run: |
          set -euo pipefail
          terraform output -no-color -json > /tmp/tf-output.json
          {
            echo "## Terraform output (dev)"
            echo
            jq -r 'to_entries[] | "- **\(.key)**: `\(.value.value // "null")`"' /tmp/tf-output.json
          } >> "$GITHUB_STEP_SUMMARY"
