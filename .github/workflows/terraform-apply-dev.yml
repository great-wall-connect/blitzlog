name: terraform-apply-dev

# Manual workflow to apply infra/dev without going through the
# full release cycle (release.yml takes ~35 min for the image
# build + Packer bake; this workflow is a ~3-5 min terraform-only
# path). Use this when:
#
#   - You changed only infra/dev/* (e.g. tfvars, module code, IAM
#     policy) and don't need a new image baked.
#   - You want to verify a feature branch's infra changes against
#     a real AWS account before merging.
#   - You rotated a secret (TF_VAR_*) and want to push the new
#     value into the dev Lambda's environment without a release.
#
# Triggers: workflow_dispatch only. No auto-apply on push or PR.
#
# Prod is NOT exposed here — prod applies are part of the
# canonical release cycle (.github/workflows/release.yml in
# release mode) and require CODEOWNERS approval via the
# `production` GitHub Environment. The manual dev path is the
# fast-feedback escape hatch for non-prod work.
#
# Concurrency: group `terraform-dev` serializes CI runs
# (cancel-in-progress: false) so a long apply blocks the next
# one rather than racing it. Local-vs-CI races remain possible
# (the project chose no DynamoDB lock table; see
# README.md:295-307).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to apply from. Defaults to `github.ref_name` (the branch the workflow was triggered from)."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  apply-dev:
    name: Apply terraform (dev)
    runs-on: ubuntu-26.04-arm
    # 20 min covers a typical plan + apply + local-exec (Python 3.12
    # venv + pip install for the lambda bundle, see
    # infra/modules/core/lambda.tf:35-92). The local-exec is the
    # slow step on cold caches; subsequent runs reuse the venv
    # and finish in <5 min.
    timeout-minutes: 20
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    env:
      BLITZLOG_ENV: dev
      STATE_KEY: dev/blitzlog.tfstate
      AWS_REGION: ap-east-1
      # Default to the workflow's ref_name when the operator
      # leaves the input blank (typical when dispatched from
      # the GitHub UI on a feature branch).
      BUILD_REF: ${{ inputs.ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          # fetch-depth: 0 keeps git history available for
          # `null_resource.lambda_build`'s filemd5 triggers
          # (infra/modules/core/lambda.tf:35-92) and matches
          # the `terraform_data` provisioner behavior.
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        # The local-exec in null_resource.lambda_build resolves
        # Python 3.12 from `~/.local/share/mise/installs/python/...`
        # (see infra/modules/core/lambda.tf:65-75). mise.toml pins
        # python = "3.12", so `mise install` puts it there.
        run: mise install

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC) for terraform
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # OIDC into the role provisioned by infra/bootstrap/
          # deploy-role.tf. The same repo variable (`AWS_ACCOUNT_ID`)
          # is used by the Packer workflow in release.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/blitzlog-deploy-role
          aws-region: ap-east-1

      # Map per-env secrets onto the TF_VAR_* env vars terraform
      # reads at apply time. We never write the values to disk —
      # they live only in GITHUB_ENV for the duration of this run.
      # The secrets are uppercased TF_VAR_<NAME>_DEV in the repo
      # Settings → Secrets UI; the run block maps them to
      # lowercase TF_VAR_<name> to match terraform's naming
      # convention.
      #
      # The heredoc syntax (`VAR<<EOF\n...\nEOF`) is the GH Actions
      # pattern for safely passing multi-line values to GITHUB_ENV.
      # Without it, a PEM private key (newlines!) would be mangled
      # and `terraform apply` would reject the value.
      - name: Render TF_VAR_* env from secrets
        env:
          # Pull each secret into a single-line shell var named
          # S_<NAME>. The `secrets[format(...)]` index access
          # returns "" if the secret is missing, so secrets with
          # safe defaults (alert_email, aws_profile, ssh_allowed_cidrs,
          # upload_stt_model, stt_models_bucket_name, ...) flow
          # through the empty-string path and let terraform use
          # the variable's default.
          S_AWS_REGION: ${{ secrets.TF_VAR_AWS_REGION_DEV }}
          S_VPC_ID: ${{ secrets.TF_VAR_VPC_ID_DEV }}
          S_EC2_SUBNET_ID: ${{ secrets.TF_VAR_EC2_SUBNET_ID_DEV }}
          S_SSH_ALLOWED_CIDRS: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDRS_DEV }}
          S_GITHUB_APP_ID: ${{ secrets.TF_VAR_GITHUB_APP_ID_DEV }}
          S_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TF_VAR_GITHUB_APP_PRIVATE_KEY_DEV }}
          S_GITHUB_APP_INSTALLATION_ID: ${{ secrets.TF_VAR_GITHUB_APP_INSTALLATION_ID_DEV }}
          S_GITHUB_WEBHOOK_SECRET: ${{ secrets.TF_VAR_GITHUB_WEBHOOK_SECRET_DEV }}
          S_ALERT_EMAIL: ${{ secrets.TF_VAR_ALERT_EMAIL_DEV }}
          S_OPENCODE_MODEL: ${{ secrets.TF_VAR_OPENCODE_MODEL_DEV }}
          S_OPENCODE_AGENT_MAX_STEPS: ${{ secrets.TF_VAR_OPENCODE_AGENT_MAX_STEPS_DEV }}
          S_OPENCODE_API_KEY: ${{ secrets.TF_VAR_OPENCODE_API_KEY_DEV }}
          S_AGENT_LOGS_BUCKET_NAME: ${{ secrets.TF_VAR_AGENT_LOGS_BUCKET_NAME_DEV }}
          S_STT_API_URL: ${{ secrets.TF_VAR_STT_API_URL_DEV }}
          S_STT_API_KEY: ${{ secrets.TF_VAR_STT_API_KEY_DEV }}
          S_STT_MODEL: ${{ secrets.TF_VAR_STT_MODEL_DEV }}
          S_STT_LANGUAGE: ${{ secrets.TF_VAR_STT_LANGUAGE_DEV }}
          S_UPLOAD_STT_MODEL: ${{ secrets.TF_VAR_UPLOAD_STT_MODEL_DEV }}
          S_STT_MODEL_SOURCE_URL: ${{ secrets.TF_VAR_STT_MODEL_SOURCE_URL_DEV }}
          S_STT_MODELS_BUCKET_NAME: ${{ secrets.TF_VAR_STT_MODELS_BUCKET_NAME_DEV }}
          S_AWS_PROFILE: ${{ secrets.TF_VAR_AWS_PROFILE_DEV }}
          S_SPOT_INSTANCE_TYPES: ${{ secrets.TF_VAR_SPOT_INSTANCE_TYPES_DEV }}
        run: |
          set -euo pipefail
          # write_var NAME VALUE -> GITHUB_ENV using the heredoc
          # form so multi-line values (notably
          # GITHUB_APP_PRIVATE_KEY, a PEM) survive intact.
          write_var() {
            local var_name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              {
                echo "${var_name}<<EOF"
                printf '%s' "$value"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi
          }
          write_var TF_VAR_aws_region "$S_AWS_REGION"
          write_var TF_VAR_vpc_id "$S_VPC_ID"
          write_var TF_VAR_ec2_subnet_id "$S_EC2_SUBNET_ID"
          write_var TF_VAR_ssh_allowed_cidrs "$S_SSH_ALLOWED_CIDRS"
          write_var TF_VAR_github_app_id "$S_GITHUB_APP_ID"
          write_var TF_VAR_github_app_private_key "$S_GITHUB_APP_PRIVATE_KEY"
          write_var TF_VAR_github_app_installation_id "$S_GITHUB_APP_INSTALLATION_ID"
          write_var TF_VAR_github_webhook_secret "$S_GITHUB_WEBHOOK_SECRET"
          write_var TF_VAR_alert_email "$S_ALERT_EMAIL"
          write_var TF_VAR_opencode_model "$S_OPENCODE_MODEL"
          write_var TF_VAR_opencode_agent_max_steps "$S_OPENCODE_AGENT_MAX_STEPS"
          write_var TF_VAR_opencode_api_key "$S_OPENCODE_API_KEY"
          write_var TF_VAR_agent_logs_bucket_name "$S_AGENT_LOGS_BUCKET_NAME"
          write_var TF_VAR_stt_api_url "$S_STT_API_URL"
          write_var TF_VAR_stt_api_key "$S_STT_API_KEY"
          write_var TF_VAR_stt_model "$S_STT_MODEL"
          write_var TF_VAR_stt_language "$S_STT_LANGUAGE"
          write_var TF_VAR_upload_stt_model "$S_UPLOAD_STT_MODEL"
          write_var TF_VAR_stt_model_source_url "$S_STT_MODEL_SOURCE_URL"
          write_var TF_VAR_stt_models_bucket_name "$S_STT_MODELS_BUCKET_NAME"
          write_var TF_VAR_aws_profile "$S_AWS_PROFILE"
          write_var TF_VAR_spot_instance_types "$S_SPOT_INSTANCE_TYPES"

          # Required-var sanity check: at least one of the bare
          # required vars must be set, otherwise the apply will
          # surface a confusing "variable not set" error mid-run.
          if [ -z "${TF_VAR_aws_region:-}" ]; then
            echo "FATAL: TF_VAR_AWS_REGION_DEV is not set in repo secrets" >&2
            exit 1
          fi
          if [ -z "${TF_VAR_vpc_id:-}" ]; then
            echo "FATAL: TF_VAR_VPC_ID_DEV is not set in repo secrets" >&2
            exit 1
          fi
          if [ -z "${TF_VAR_github_app_id:-}" ]; then
            echo "FATAL: TF_VAR_GITHUB_APP_ID_DEV is not set in repo secrets" >&2
            exit 1
          fi

      # Backend config is passed inline so no `*.hcl` file is
      # materialized on the runner. The bucket comes from
      # secrets.TF_BACKEND_BUCKET (the operator may use a
      # non-default state bucket), the key is `dev/blitzlog.tfstate`
      # to match infra/prod/main.tf's backend handoff, the region
      # is hard-coded ap-east-1.
      - name: terraform init
        working-directory: infra/dev
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ env.STATE_KEY }}" \
            -backend-config="region=ap-east-1"

      - name: terraform validate
        working-directory: infra/dev
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        working-directory: infra/dev
        run: |
          set -euo pipefail
          # -out=tfplan serialises the plan to a file so the
          # apply step consumes the exact same plan (no drift
          # between plan and apply). -no-color keeps the log
          # readable in the GH Actions UI.
          terraform plan -no-color -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/dev/tfplan
          # 14-day retention matches the release.yml deploy
          # path; the plan is a snapshot, not a long-lived
          # artifact.
          retention-days: 14

      - name: terraform apply
        id: apply
        working-directory: infra/dev
        # Always consumes the plan from the previous step; never
        # re-plans in-band. Keeps plan↔apply symmetric so a
        # reviewer looking at the artifact can be sure the apply
        # matches what they saw.
        run: terraform apply -no-color -input=false tfplan

      - name: Capture terraform output
        if: steps.apply.outcome == 'success'
        working-directory: infra/dev
        # `webhook_url` is the only output the operator needs
        # after a successful apply (it's the URL the GitHub App
        # webhook should target). Capture the full -json output
        # to the run summary so the operator can grep for any
        # other outputs without re-running plan/apply.
        run: |
          set -euo pipefail
          terraform output -no-color -json > /tmp/tf-output.json
          {
            echo "## Terraform output (dev)"
            echo
            jq -r 'to_entries[] | "- **\(.key)**: `\(.value.value // "null")`"' /tmp/tf-output.json
          } >> "$GITHUB_STEP_SUMMARY"
