name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    env:
      IMAGE_NAME: blitzlog-agent
      REGISTRY: ghcr.io
      OWNER: great-wall-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Lambda bundle
        run: mise run build

      - name: Zip Lambda bundle for release asset
        run: (cd infra/build && zip -r ../blitzlog-lambda.zip .)

      - name: Build and push blitzlog-agent image
        uses: docker/build-push-action@v7
        with:
          context: ./packages/images/agent
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Image size gate
        run: |
          docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' \
            | awk '$1 ~ /GB/ { split($1, parts, "G"); if (parts[1] + 0 > 2.0) { print "REJECTED (too big): " $0; exit 1 } }'
          echo "Image size OK"

      - name: Upload Lambda zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: infra/blitzlog-lambda.zip