name: release

# Manual release workflow. Triggered only via workflow_dispatch.
# The mode (pr-test vs release) and the bump type are auto-detected
# from the dispatched ref + the conventional commits in its diff.
# The only operator input is `ref`; everything else is computed.
#
# Mode selection (ref-gated, issue #131):
#   The Detect step's primary gate is the REF, not the PR status.
#   This is the safety mechanism that prevents an accidental
#   `gh workflow run release.yml --ref feature/foo` from deploying
#   to prod. The PR check is a secondary signal that picks
#   between pr-test and "refuse to run" on non-release refs.
#
#   - BUILD_REF = "main"                       -> MODE = release
#                                                 (canonical release path)
#   - BUILD_REF = "release/*"                  -> MODE = release
#                                                 (fallback when direct push
#                                                 to main fails; the
#                                                 release/vX.Y.Z-<ts>
#                                                 branch + gh pr create
#                                                 path in the Bump step)
#   - BUILD_REF = anything else, has open PR   -> MODE = pr-test
#                                                 (build PR image, comment
#                                                 on the PR, no tag, no
#                                                 prod apply)
#   - BUILD_REF = anything else, no open PR    -> FATAL
#                                                 (refuses to run; the
#                                                 operator must either
#                                                 merge to main, or push
#                                                 a release/* branch, or
#                                                 open a PR if they want
#                                                 a pr-test)
#
# PR-test path (open PR on the dispatched ref):
#   * reads version from lambda/version.py
#   * auto-detects bump type from the conventional commits in the
#     PR's diff via git-cliff (BREAKING CHANGE:/feat!:/feat(...):/fix:/
#     default = major/minor/minor/patch)
#   * builds and pushes the agent image with tag v{X}-pr{N} (no :latest)
#   * bakes a dev AMI from that image and publishes its id to
#     /blitzlog/dev/agent-ami-id-docker-ubuntu
#   * posts a PR comment describing the build (fails loudly if no
#     PR is found)
#   * does NOT touch the source (no version bump, no tag, no
#     push back to the dispatch ref)
#
# Release path (BUILD_REF is main or release/*):
#   * reads current version
#   * auto-detects bump type from the conventional commits in the
#     diff range (last release tag -> ref) via git-cliff
#   * updates lambda/version.py
#   * commits with [skip ci]
#   * pushes (with fallback to a release/vX.Y.Z-<ts> branch +
#     gh pr create if direct push to BUILD_REF fails; the
#     release branch becomes the ref the Tag step uses)
#   * builds and pushes the agent image with tags v{X} + :latest
#   * bakes a prod AMI from that image and publishes its id to
#     /blitzlog/prod/agent-ami-id-docker-ubuntu
#   * tags v{X} and pushes the tag
#   * uploads the Lambda zip to a GitHub Release
#
# The operator runs ONE of:
#   gh workflow run release.yml --ref main
#   gh workflow run release.yml --ref release/v0.4.0
#   gh workflow run release.yml --ref <feature-branch-with-open-PR>
#
# Packer integration added by issue #91: the previous local `packer build`
# step is gone; everything goes through this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build from. Mode is auto-detected from the ref: main or release/* -> release (bump source + commit + tag + prod apply); any other ref with an open PR -> pr-test (image only); any other ref without an open PR -> refused. See the workflow header for the full ref-gate table."
        required: false
        type: string

permissions:
  contents: write
  packages: write
  # Required for the fallback "create release branch + open PR" path
  # in the Bump step.
  pull-requests: write
  # Required for OIDC into blitzlog-packer-build-role when baking the
  # AMI in the Packer build steps below.
  id-token: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-26.04-arm
    # 35 min covers worst case: docker build ~5min + Packer ~12min + tag
    # push + Lambda zip + buffer. The Packer bake was added in #91 and
    # grew the budget from the previous 20min.
    timeout-minutes: 35

    # Job-level outputs surfaced to the `deploy` job below. Mirrors
    # the step-level outputs from the Detect step (mode / pr_number /
    # new_version) so the deploy job can map mode -> env without
    # re-running the same git-cliff / gh-pr-list logic.
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      new_version: ${{ steps.detect.outputs.new_version }}

    env:
      IMAGE_NAME: blitzlog-agent
      REGISTRY: ghcr.io
      OWNER: great-wall-connect
      BUILD_REF: ${{ inputs.ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          fetch-tags: true

      # Decide the mode (pr-test vs release) from the BUILD_REF +
      # the ref's open-PR status. The primary gate is the ref itself
      # (issue #131): only `main` and `release/*` are eligible for the
      # canonical release path. The PR check is a secondary signal
      # that picks between pr-test and "refuse to run" on non-release
      # refs. The bump type is auto-detected from the conventional
      # commits in the diff (last release tag -> $BUILD_REF) via
      # git-cliff (a battle-hardened conventional-commits parser).
      - name: Detect mode and bump type
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Install git-cliff. The Detect step uses `git-cliff
          # --bumped-version` to compute the new version from the
          # conventional commits since the last v* tag. git-cliff
          # correctly handles all edge cases (BREAKING CHANGE: in
          # body, `feat!:` subject, post-breaking fix: commits, etc.)
          # — which is the correctness we couldn't get from a
          # hand-rolled bash parser or from cocogitto 7.0.0's
          # `--auto` flag.
          #
          # Pinned to a specific release rather than `/latest/` so the
          # runner is hermetic; bump CLIFF_VERSION here when upgrading.
          #
          # URL notes (verified against the actual GitHub release):
          # - git-cliff tags use the `v` prefix (`v2.14.2`), so the
          #   download path is `releases/download/v${CLIFF_VERSION}/...`
          #   (without the `v` would 404).
          # - Asset name embeds the version AND the target triple.
          #   The runner is `ubuntu-26.04-arm` (ARM64, glibc), so we
          #   download the `aarch64-unknown-linux-gnu` tarball.
          CLIFF_VERSION="2.14.2"
          # The tarball's top-level directory is `git-cliff-${CLIFF_VERSION}/`,
          # with the binary at `git-cliff-${CLIFF_VERSION}/git-cliff`. Use
          # --strip-components=1 to drop the leading directory and extract
          # `git-cliff` (plus the LICENSE files) directly into /usr/local/bin.
          curl -fsSL \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin
          git-cliff --version

          # Ref-gate (issue #131). The primary safety mechanism: only
          # `main` and `release/*` are eligible for the canonical
          # release path. Any other ref must have an open PR (pr-test
          # path) or it is refused outright. This is the regression
          # guard for release #32 (where dispatching on a feature
          # branch without an open PR produced a prod v0.4.0
          # release because the previous "no PR -> release" gate
          # treated any feature branch as a release candidate).
          #
          # Match the BUILD_REF exactly. The earlier `--head "$ref"`
          # form had a known prefix-collision failure mode (Gemini
          # analysis, 2026-10-12): if a ref like `feature/foo` is
          # queried, branches like `feature/foo-bar` and `feature/foobar`
          # all match because the filter is a `startsWith` style match.
          # The pipe-to-jq form below does an exact-string match
          # on `headRefName` and is the safe replacement for the
          # broken `gh pr list --head "$ref"` form (which is
          # startsWith-style and silently returns empty for fork
          # PRs — release #32 regressed on this; see issue #131).
          #
          # Why the pipe shape, NOT the broken form (passing the
          # `jq` flag `--arg r VALUE` to `gh` as a positional arg):
          # `gh` doesn't accept `--arg` and errors with
          # `unknown arguments ["r" VALUE EXPR]` (regression caught
          # by run #38261612554 on 2026-10-12 14:15 UTC). Pushing
          # the expression to a real `jq` invocation via a pipe
          # lets `--arg` route correctly. Pinned by
          # `test_pr_list_pipes_to_jq_not_uses_gh_arg` (the
          # matching regression-guard test).
          PR_NUMBER=$(gh pr list --state open --json number,headRefName \
            | jq --arg r "${{ env.BUILD_REF }}" \
                 '.[] | select(.headRefName == $r) | .number' \
            | head -1 || true)
          case "${{ env.BUILD_REF }}" in
            main)
              # Canonical release path. If a PR is open against
              # main, the operator is running a pr-test against the
              # main tip — downgrade to pr-test.
              if [ -n "$PR_NUMBER" ]; then
                MODE=pr-test
              else
                MODE=release
              fi
              ;;
            release/*)
              # Fallback release branch path. PRs against a
              # release/* branch are also pr-test.
              if [ -n "$PR_NUMBER" ]; then
                MODE=pr-test
              else
                MODE=release
              fi
              ;;
            *)
              # Any other ref. Must have an open PR to qualify
              # as pr-test. Without one, refuse with a clear
              # operator-actionable message — the previous gate
              # silently fell into release mode and deployed
              # to prod.
              if [ -n "$PR_NUMBER" ]; then
                MODE=pr-test
              else
                echo "FATAL: BUILD_REF='${{ env.BUILD_REF }}' is not a release ref and has no open PR." >&2
                echo "  Allowed release refs: 'main' (canonical) or 'release/*' (fallback branch path)." >&2
                echo "  For a PR-test image, open a PR with '${{ env.BUILD_REF }}' as the head first." >&2
                echo "  For a production release, dispatch on 'main' (or merge this branch to main and dispatch from there)." >&2
                echo "  Refusing to run so a feature-branch dispatch cannot accidentally deploy to prod (issue #131)." >&2
                exit 1
              fi
              ;;
          esac

          # Bump type: ask git-cliff. It reads the conventional commits
          # since the last v* tag and outputs the next SemVer on stdout.
          # Fail loud if no v* tag is reachable.
          LAST_TAG=$(git describe --tags --abbrev=0 "${{ env.BUILD_REF }}" 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "FATAL: no v* release tag reachable from ${{ env.BUILD_REF }}; cannot determine bump base." >&2
            echo "  If this is the first release, push a v0.1.1 tag manually first." >&2
            exit 1
          fi
          BUMP_BASE="${LAST_TAG#v}"

          # git-cliff's --bumped-version prints the next SemVer for
          # the unreleased commits (everything since the last v* tag)
          # on stdout, with the same prefix as the previous tag
          # (so for a `v0.1.1` tag, it returns `v0.1.2`). We don't
          # let git-cliff write to disk or create commits — the Bump
          # step below does the file update + commit + tag explicitly
          # so the workflow's behavior is fully visible and testable.
          # Strip the `v` prefix so the regex below is a plain SemVer.
          NEW_VERSION=$(git-cliff --bumped-version 2>/dev/null | tail -1 | sed 's/^v//')
          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FATAL: git-cliff did not return a semver: '$NEW_VERSION'" >&2
            exit 1
          fi

          # Derive bump type from the version-component diff.
          IFS=. read -r CUR_MAJOR CUR_MINOR CUR_PATCH <<< "$BUMP_BASE"
          IFS=. read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW_VERSION"
          if   [ "$NEW_MAJOR" -gt "$CUR_MAJOR" ]; then BUMP=major
          elif [ "$NEW_MINOR" -gt "$CUR_MINOR" ]; then BUMP=minor
          else                                        BUMP=patch
          fi

          # ALIGNMENT INVARIANT: the last v* tag's version must equal
          # the literal in lambda/version.py. Catches drift where
          # someone tags or bumps one without the other, before the
          # Bump step makes any changes. Pinned by
          # tests/test_release_workflow.py::test_detect_step_aligns_tag_and_version_file.
          FILE_VERSION=$(grep -E '^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' lambda/version.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -1)
          if [ -n "$FILE_VERSION" ] && [ "$FILE_VERSION" != "$BUMP_BASE" ]; then
            echo "FATAL: tag/version drift — last v* tag is v$BUMP_BASE but lambda/version.py says $FILE_VERSION" >&2
            echo "  Reconcile them (re-tag or re-bump the file) and re-run." >&2
            exit 1
          fi

          echo "Resolved current version: $BUMP_BASE (from $LAST_TAG)"
          echo "Detected bump type: $BUMP"
          echo "Computed new version: $NEW_VERSION"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install mise
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        run: mise install

      - name: Set up QEMU
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Lambda bundle
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        run: mise run build

      - name: Zip Lambda bundle for release asset
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        run: (cd infra/build && zip -r ../blitzlog-lambda.zip .)

      # Build and push the agent image. The tag depends on the mode:
      #   pr-test  -> v{new_version}-pr{N}  (e.g. v0.1.1-pr107)
      #   release -> v{new_version} + :latest
      #
      # NOTE: the tag formula here MUST match the AGENT_IMAGE_TAG
      # computed in the "Resolve Packer vars" step below — Packer
      # bakes exactly this image tag into the AMI.
      - name: Build and push blitzlog-agent image
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        env:
          IMAGE_TAG: ${{ steps.detect.outputs.new_version }}
          SUFFIX_TO_USE: ${{ steps.detect.outputs.mode == 'pr-test' && format('-pr{0}', steps.detect.outputs.pr_number) || '' }}
        run: |
          set -euo pipefail
          IMAGE_BASE="${REGISTRY}/${OWNER}/${IMAGE_NAME}:v${IMAGE_TAG}${SUFFIX_TO_USE}"
          IMAGE_LATEST="${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest"
          echo "Pushing: $IMAGE_BASE"
          if [ "${{ steps.detect.outputs.mode }}" = "release" ]; then
            echo "Also pushing: $IMAGE_LATEST"
            docker buildx build \
              --push \
              --platform linux/arm64 \
              -t "$IMAGE_BASE" \
              -t "$IMAGE_LATEST" \
              ./packages/images/agent
          else
            docker buildx build \
              --push \
              --platform linux/arm64 \
              -t "$IMAGE_BASE" \
              ./packages/images/agent
          fi

      # ----------------------------------------------------------------
      # Bake the AMI from the image we just pushed (issue #91).
      #
      # The Packer pipeline (infra/aws/packer/agent-docker-ubuntu.pkr.hcl)
      # already publishes the AMI id to /blitzlog/<env>/agent-ami-id-
      # docker-ubuntu via its shell-local post-processor; we just need
      # to map mode -> Packer `environment`:
      #
      #   pr-test  -> environment=dev   -> /blitzlog/dev/... (dev agents)
      #   release -> environment=prod  -> /blitzlog/prod/... (prod agents)
      #
      # agent_image_tag MUST match the IMAGE_BASE tag above (the one
      # that was just pushed); see the NOTE on the build step.
      # ----------------------------------------------------------------

      - name: Install Packer
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: hashicorp/setup-packer@v2
        # v2 of hashicorp/setup-packer renamed the input from
        # `packer_version` (v1) to `version`. Passing the old name fails
        # the step with "Unexpected input(s) 'packer_version', valid
        # inputs are ['version']" before any Packer command runs.
        with:
          version: 1.16.1

      - name: Configure AWS credentials (OIDC) for Packer
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # OIDC into the role that infra/aws/bootstrap/packer-role.tf
          # provisions. Trust policy already covers any branch of
          # great-wall-connect/blitzlog. vars.AWS_ACCOUNT_ID must
          # be set at the repo or org level before this runs.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/blitzlog-packer-build-role
          aws-region: ap-east-1

      - name: Resolve Packer vars from mode
        id: packer-vars
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        env:
          MODE: ${{ steps.detect.outputs.mode }}
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          PR_NUMBER: ${{ steps.detect.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "pr-test" ]; then
            # PR mode -> dev env (PR images get baked into the dev AMI;
            # last-writer-wins on /blitzlog/dev/agent-ami-id-docker-ubuntu).
            BLITZLOG_ENV=dev
            STT_BUCKET=gwc-blitzlog-stt-models
            AGENT_IMAGE_TAG="v${NEW_VERSION}-pr${PR_NUMBER}"
            SSM_PATH="/blitzlog/dev/agent-ami-id-docker-ubuntu"
          else
            # release mode -> prod env
            BLITZLOG_ENV=prod
            STT_BUCKET=gwc-blitzlog-stt-models
            AGENT_IMAGE_TAG="v${NEW_VERSION}"
            SSM_PATH="/blitzlog/prod/agent-ami-id-docker-ubuntu"
          fi
          echo "blitzlog_env=$BLITZLOG_ENV"      >> "$GITHUB_OUTPUT"
          echo "stt_bucket=$STT_BUCKET"          >> "$GITHUB_OUTPUT"
          echo "agent_image_tag=$AGENT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "ssm_path=$SSM_PATH"              >> "$GITHUB_OUTPUT"

      - name: Packer init
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        working-directory: infra/packer
        run: packer init agent-docker-ubuntu.pkr.hcl

      - name: Packer build (bake AMI, publish id to SSM)
        id: packer
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        working-directory: infra/packer
        env:
          BLITZLOG_ENV: ${{ steps.packer-vars.outputs.blitzlog_env }}
          STT_BUCKET: ${{ steps.packer-vars.outputs.stt_bucket }}
          AGENT_IMAGE_TAG: ${{ steps.packer-vars.outputs.agent_image_tag }}
          # GITHUB_TOKEN is consumed by 03-bake-images.sh to `docker login
          # ghcr.io` before pulling the blitzlog-agent image. Empty when
          # the secret isn't set; the script warns and the pull fails.
          GH_TOKEN_FOR_PACKER: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # -force skips the "Do you want to proceed?" prompt that Packer
          # emits in non-TTY / non-CI-detected contexts. Safe here because
          # the build is operator-dispatched and the packer-role's IAM
          # already gates what the build can do.
          packer build -force \
              -var "environment=${BLITZLOG_ENV}" \
              -var "agent_image_tag=${AGENT_IMAGE_TAG}" \
              -var "stt_models_bucket=${STT_BUCKET}" \
              -var "github_token=${GH_TOKEN_FOR_PACKER}" \
              -var-file docker-images.pkrvars.hcl \
              agent-docker-ubuntu.pkr.hcl
          # Packer writes manifest.json (via the `manifest` post-processor
          # in agent-docker-ubuntu.pkr.hcl) with the build's artifact_id
          # in the form "<region>:ami-<id>". The same source of truth the
          # 05-publish-ami-id.sh post-processor reads from.
          if [ ! -r manifest.json ]; then
            echo "FATAL: Packer did not write manifest.json (build may have failed before the post-processor ran)" >&2
            exit 1
          fi
          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | awk -F: '{print $2}')
          if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "null" ]; then
            echo "FATAL: could not extract AMI id from manifest.json:" >&2
            jq . manifest.json | sed 's/^/    /' >&2
            exit 1
          fi
          echo "Baked AMI: $AMI_ID"
          echo "Published to ${{ steps.packer-vars.outputs.ssm_path }} via the Packer post-processor (05-publish-ami-id.sh)."
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      # PR-test-only: post a PR comment describing the build. Fails loudly
      # if no open PR is found on $BUILD_REF (we already detected this
      # in the Detect step; here we re-check and emit a clear error).
      - name: Post PR-test release comment
        if: steps.detect.outputs.mode == 'pr-test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.detect.outputs.pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "FATAL: pr-test mode requires an open PR for ${{ env.BUILD_REF }}" >&2
            exit 1
          fi
          IMAGE_TAG="v${{ steps.detect.outputs.new_version }}-pr${PR_NUMBER}"
          NEW_VERSION="${{ steps.detect.outputs.new_version }}"
          BUMP="${{ steps.detect.outputs.bump }}"
          CURRENT=$(grep -E '^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' lambda/version.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          AMI_ID="${{ steps.packer.outputs.ami_id }}"
          SSM_PATH="${{ steps.packer-vars.outputs.ssm_path }}"
          COMMENT_BODY="## Release PR-test output"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Current version (lambda/version.py): \`${CURRENT}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Bump type (auto-detected by git-cliff from conventional commits): \`${BUMP}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- New version: \`${NEW_VERSION}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Image tag: \`${IMAGE_TAG}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Image registry: \`${REGISTRY}/${OWNER}/${IMAGE_NAME}:${IMAGE_TAG}\`"
          COMMENT_BODY+=$'\n'
          if [ -n "$AMI_ID" ]; then
            COMMENT_BODY+="- AMI id: \`${AMI_ID}\`"
            COMMENT_BODY+=$'\n'
            COMMENT_BODY+="- SSM param (dev): \`${SSM_PATH}\`"
            COMMENT_BODY+=$'\n'
          fi
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="The image is built and pushed with the bumped version, and a dev AMI has been baked from it. Source is NOT modified by this run. To land this version on the canonical release branch, run this workflow against \`main\` (or a release branch) — the mode auto-detects from the ref's open-PR status."
          gh pr comment "${PR_NUMBER}" --body "${COMMENT_BODY}" || true

      # Release-only: bump lambda/version.py, commit, push (with
      # fallback to release branch + gh pr create if direct push to
      # BUILD_REF fails), then tag. lambda/version.py is the only
      # source of truth — no manifest file to keep in sync.
      - name: Bump version in source (release only)
        if: steps.detect.outputs.mode == 'release'
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Operator-supplied repo variable identifying the pool
          # whose /blitzlog/users/<OWNER>/git-author/{name,email}
          # SSM params hold the commit author identity. The
          # deploy-role's SSMGitAuthorIdentityRead grant (see
          # infra/aws/bootstrap/deploy-role.tf) lets the worker fetch
          # them. Optional: when unset, the Bump step falls back
          # to the historical `release-bot` identity (issue #119
          # legacy carve-out) so the canonical release pipeline
          # works on a repo that hasn't yet provisioned a
          # user-pool stack. Operators who want the per-pool
          # identity set vars.OWNER_LOGIN at the repo level and
          # `cd infra/user-pool && terraform apply` once; the
          # fallback then silently picks up the SSM-sourced
          # identity.
          OWNER_LOGIN: ${{ vars.OWNER_LOGIN }}
        run: |
          set -euo pipefail
          # Identity resolution (issue #119, fallback to release-bot):
          #   1. vars.OWNER_LOGIN set + SSM git-author params set
          #      -> use the operator-managed identity
          #   2. vars.OWNER_LOGIN unset OR SSM params missing
          #      -> use the historical `release-bot` literal
          #         (matches pre-#119 behavior, keeps the canonical
          #         [skip ci] Bump commit attributable to a stable
          #         bot identity that any reviewer can map to a
          #         GitHub account)
          #
          # This is a deliberate relaxation from the strict
          # fail-loud in PR #128: the strict version required
          # operator setup before any release could run, which
          # broke the canonical release pipeline on main where
          # no operator has run the bootstrap yet. The fallback
          # is opt-out (set vars.OWNER_LOGIN to a real owner to
          # turn it off; the SSM-missing branch then triggers
          # the FATAL with the same operator-actionable hint as
          # before).
          if [ -n "${OWNER_LOGIN:-}" ]; then
            GIT_AUTHOR_NAME=$(aws ssm get-parameter \
              --name "/blitzlog/users/${OWNER_LOGIN}/git-author/name" \
              --query Parameter.Value --output text --region ap-east-1 \
              2>/dev/null || echo "")
            GIT_AUTHOR_EMAIL=$(aws ssm get-parameter \
              --name "/blitzlog/users/${OWNER_LOGIN}/git-author/email" \
              --query Parameter.Value --output text --region ap-east-1 \
              2>/dev/null || echo "")
            if [ -z "$GIT_AUTHOR_NAME" ] || [ -z "$GIT_AUTHOR_EMAIL" ]; then
              echo "FATAL: /blitzlog/users/${OWNER_LOGIN}/git-author/{name,email}" >&2
              echo "  are not set in SSM (issue #119). Either:" >&2
              echo "  - run 'cd infra/user-pool && terraform apply' after" >&2
              echo "    setting git_author_name / git_author_email in" >&2
              echo "    infra/user-pool/terraform.tfvars (defaults derive" >&2
              echo "    from owner_login when both are unset), OR" >&2
              echo "  - unset vars.OWNER_LOGIN to fall back to the" >&2
              echo "    historical release-bot identity." >&2
              exit 1
            fi
            echo "Using operator-managed git identity from /blitzlog/users/${OWNER_LOGIN}/git-author/{name,email}"
          else
            # Legacy fallback. Matches the pre-#119 Bump step's
            # hardcoded identity verbatim so the canonical release
            # pipeline works on a repo that hasn't yet provisioned
            # a user-pool. Emitting a WARN (not a fatal) keeps
            # the operator's attention on the migration path
            # without blocking releases.
            echo "WARN: vars.OWNER_LOGIN is unset; falling back to the historical 'release-bot' identity" >&2
            echo "  (issue #119 legacy carve-out). To use an operator-managed identity instead, set" >&2
            echo "  vars.OWNER_LOGIN to a GitHub login and run 'cd infra/user-pool && terraform apply'." >&2
            GIT_AUTHOR_NAME="release-bot"
            GIT_AUTHOR_EMAIL="release-bot@users.noreply.github.com"
          fi
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          NEW_VERSION="${{ steps.detect.outputs.new_version }}"
          sed -i -E "s/^__version__\\s*=\\s*\"([0-9]+\\.[0-9]+\\.[0-9]+)\"/__version__ = \"${NEW_VERSION}\"/" lambda/version.py
          git add lambda/version.py
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]"

          # Try direct push to BUILD_REF. If that succeeds, that's the
          # ref the Tag step will use. If it fails (typical for `main`
          # with branch protection), create a release branch + open a
          # PR; the release branch becomes the ref the Tag step uses.
          if git push origin "${{ env.BUILD_REF }}"; then
            echo "release_ref=${{ env.BUILD_REF }}" >> "$GITHUB_OUTPUT"
          else
            echo "WARN: direct push to ${{ env.BUILD_REF }} failed (likely branch protection); falling back to release branch + PR" >&2
            RELEASE_BRANCH="release/v${NEW_VERSION}-$(date +%s)"
            git checkout -b "$RELEASE_BRANCH"
            git push origin "$RELEASE_BRANCH"
            gh pr create \
              --base "${{ env.BUILD_REF }}" \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): ${NEW_VERSION}" \
              --body "Automated release PR.\n\nBumps \`lambda/version.py\` to ${NEW_VERSION}.\n\nMerge to trigger the release image build via the canonical v* tag path." \
              --label "release" || true
            echo "release_ref=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      # Release-only: tag the release. Consumes the Bump step's
      # `release_ref` output. The `if: steps.detect.outputs.mode == ...`
      # is already enforced via this step's gate on Bump.
      - name: Tag the release (release only)
        if: steps.detect.outputs.mode == 'release' && steps.bump.outputs.release_ref
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.detect.outputs.new_version }}"
          git checkout "${{ steps.bump.outputs.release_ref }}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      # Release-only: upload the Lambda zip to a GitHub Release tagged
      # v{new_version}. The image-build step already pushed the image
      # with :latest.
      - name: Upload Lambda zip to release
        if: steps.detect.outputs.mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.detect.outputs.new_version }}
          files: infra/blitzlog-lambda.zip

  # ----------------------------------------------------------------
  # Apply terraform to the env implied by the release mode
  # (issue #92). The `release` job above already determined the mode
  # (pr-test vs release) from the ref's open-PR status; this job
  # maps that to a per-env stack:
  #
  #   pr-test  -> apply infra/dev
  #   release -> apply infra/prod
  #
  # OIDC role: blitzlog-deploy-role, provisioned by
  # infra/aws/bootstrap/deploy-role.tf. Trust policy mirrors the
  # Packer role's OIDC block (any branch of great-wall-connect/
  # blitzlog) but drops the EC2 service-principal statement — the
  # local-exec in infra/aws/modules/core/lambda.tf:35-92 runs on the
  # runner, not on an EC2 instance.
  #
  # Per-env concurrency serializes CI runs (cancel-in-progress:
  # false) so a long apply blocks the next one rather than racing
  # it. Local-vs-CI races remain possible (the project chose no
  # DynamoDB lock table; see infra/aws/prod/main.tf:4-9 and
  # README.md:295-307).
  #
  # Prod gate: when the mode is `release` (prod), the job would
  # normally declare `environment: production` to wait on the
  # `production` GitHub Environment's required reviewers
  # (CODEOWNERS). That gate is temporarily disabled (see TODO
  # in the deploy job) because the repo's `production` Environment
  # blocks OIDC token issuance for unmerged branches, which fails
  # the deploy step on PRs. Re-add the `environment:` block once
  # the Environment is configured to allow the merged ref.
  # ----------------------------------------------------------------
  deploy:
    name: Apply terraform (${{ needs.release.outputs.mode == 'release' && 'prod' || 'dev' }})
    needs: release
    # Default `needs.X.result` for `needs: release` is `success`,
    # so the deploy job does NOT run if the release job failed
    # (e.g. Packer bake errored or the image build couldn't push).
    # x86_64 (not -arm): the lambda bundle pip-install must
    # produce x86_64 wheels to match the lambda function's
    # default x86_64 architecture. ARM64 wheels fail to load
    # at lambda runtime with _rust.abi3.so "cannot open shared
    # object file". The release job above stays on arm because
    # the docker buildx multi-arch build + Packer Graviton
    # AMI bake both need ARM64 runners.
    runs-on: ubuntu-26.04
    # 20 min covers a typical plan + apply + local-exec (Python 3.12
    # venv + pip install for the lambda bundle, see
    # infra/aws/modules/core/lambda.tf:35-92). The Packer bake has
    # already published the AMI id to SSM, so the deploy is
    # strictly a terraform run — no AMI build.
    timeout-minutes: 20
    # TODO(#118): re-add `environment: production` here once the
    # repo's `production` GitHub Environment is configured to
    # allow this feature branch. Currently it blocks the OIDC
    # token issuance for unmerged branches, so the deploy step
    # fails on PRs. The Apply-aws-credentials action only issues
    # an id-token when the job's environment allows the ref.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-${{ needs.release.outputs.mode == 'release' && 'prod' || 'dev' }}
      cancel-in-progress: false
    env:
      BLITZLOG_ENV: ${{ needs.release.outputs.mode == 'release' && 'prod' || 'dev' }}
      # Issue #126: BLITZLOG_PROVIDER selects the per-cloud tree
      # (infra/aws/{dev,prod}/ for AWS, infra/alicloud/{dev,prod}/
      # for Alicloud). Default "aws" preserves the pre-#126
      # behaviour. The Packer step below fails fast when this is
      # set to "alicloud" because the AMI bake is AWS-only in
      # this PR; the Aliyun image builder is Phase 5.
      BLITZLOG_PROVIDER: ${{ vars.BLITZLOG_PROVIDER || 'aws' }}
      STATE_KEY: ${{ needs.release.outputs.mode == 'release' && 'prod/blitzlog.tfstate' || 'dev/blitzlog.tfstate' }}
      AWS_REGION: ap-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The release job checked out $BUILD_REF; the deploy job
          # re-checks out the same ref so the same source tree is
          # applied to the same env. fetch-depth: 0 keeps the git
          # history for the `null_resource.lambda_build` trigger
          # hashes (they read the source files via filemd5) to be
          # deterministic; fetch-tags is unnecessary here because
          # terraform doesn't read tag history.
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          fetch-depth: 0

      # Issue #126: Alicloud provider pre-flight. The Packer step
      # below is AWS-only; fail the job fast if BLITZLOG_PROVIDER is
      # alicloud. The Alicloud tree itself is applied later in this
      # job (the `terraform init/plan/apply` steps).
      - name: Validate provider
        env:
          BLITZLOG_PROVIDER: ${{ env.BLITZLOG_PROVIDER }}
        run: |
          set -euo pipefail
          case "${BLITZLOG_PROVIDER}" in
            aws) ;;
            alicloud)
              echo "FATAL: BLITZLOG_PROVIDER=alicloud is not yet supported by the Packer step (Phase 5 follow-up). Set vars.BLITZLOG_PROVIDER=aws or unset it to apply AWS." >&2
              exit 1
              ;;
            *)
              echo "FATAL: BLITZLOG_PROVIDER=${BLITZLOG_PROVIDER} is not a recognised provider. Use 'aws' or 'alicloud'." >&2
              exit 1
              ;;
          esac

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        # The local-exec in null_resource.lambda_build resolves
        # Python 3.12 from `~/.local/share/mise/installs/python/...`
        # (see infra/aws/modules/core/lambda.tf:65-75). mise.toml pins
        # python = "3.12", so `mise install` puts it there.
        run: mise install

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      # Build the Lambda bundle into `infra/aws/modules/core/build/`
      # BEFORE `terraform plan` runs. The data source
      # `module.core.data.archive_file.lambda_zip` (lambda.tf:1-7)
      # reads that directory at plan time to compute
      # `output_base64sha256`, and fails with
      # "could not archive missing directory" if the dir is
      # absent. The null_resource.lambda_build local-exec only
      # runs on `terraform apply`, so the dir doesn't exist on a
      # fresh runner by the time plan runs. The release job above
      # builds into `infra/build/` (the release asset path), not
      # `infra/aws/modules/core/build/`, so we can't share artifacts
      # between the two jobs.
      #
      # This command mirrors the local-exec in
      # `infra/aws/modules/core/lambda.tf` and uses the same
      # Python-resolution ladder (mise → system python3.12 → fail
      # loudly) plus the same `--without-pip` + get-pip.py bootstrap
      # so the build never depends on `ensurepip._bundled`. See the
      # lambda.tf `local-exec` comment block for the rationale.
      - name: Pre-build Lambda bundle
        run: |
          set -euo pipefail
          PYTHON_BIN=""
          if [ -d "$HOME/.local/share/mise/installs/python" ]; then
            PYTHON_BIN="$(ls -d "$HOME/.local/share/mise/installs/python"/3.12.*/bin/python3 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$PYTHON_BIN" ]; then
            PYTHON_BIN="$(command -v python3.12 || true)"
          fi
          if [ -z "$PYTHON_BIN" ] || [ ! -x "$PYTHON_BIN" ]; then
            echo "FATAL: Python 3.12 not found. Install via 'mise install' or 'apt install python3.12'." >&2
            exit 1
          fi
          BUILD_DIR=infra/aws/modules/core/build
          rm -rf "$BUILD_DIR" infra/aws/modules/core/.build-venv
          mkdir -p "$BUILD_DIR"
          cp -r lambda "$BUILD_DIR"/
          mkdir -p "$BUILD_DIR/lambda/packages/whisper-stt-shim"
          cp packages/whisper-stt-shim/server.py "$BUILD_DIR/lambda/packages/whisper-stt-shim/"
          "$PYTHON_BIN" -m venv --without-pip infra/aws/modules/core/.build-venv
          curl -sS https://bootstrap.pypa.io/get-pip.py | infra/aws/modules/core/.build-venv/bin/python3
          # ${LAMBDA_REQUIREMENTS_FILE:-requirements-aws.txt} lets a future
          # alicloud terraform-apply-dev job flip this to
          # requirements-alicloud.txt without touching the script body.
          # The alibaba SDKs (oss2, alibabacloud_kms20160120,
          # alibabacloud_ecs20140526) belong to requirements-alicloud.txt
          # and are NOT shipped to the AWS deploy.
          infra/aws/modules/core/.build-venv/bin/pip install --no-cache-dir -r "lambda/${LAMBDA_REQUIREMENTS_FILE:-requirements-aws.txt}" -t "$BUILD_DIR"
          rm -rf infra/aws/modules/core/.build-venv

      - name: Configure AWS credentials (OIDC) for terraform
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # OIDC into the role provisioned by infra/aws/bootstrap/
          # deploy-role.tf. The same repo variable (`AWS_ACCOUNT_ID`)
          # is used by the Packer workflow above.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/blitzlog-deploy-role
          aws-region: ap-east-1

      # Fetch per-env deploy config + secrets from SSM Parameter
      # Store. The deploy role (infra/aws/bootstrap/deploy-role.tf)
      # has `ssm:GetParametersByPath` on /blitzlog/<env>/*, so the
      # OIDC session can read these. We fetch the entire env
      # subtree in one round trip (cheaper + atomic) and map
      # each parameter's leaf name to a TF_VAR_<name> env var
      # (hyphens -> underscores).
      #
      # The values are written to GITHUB_ENV using the heredoc
      # form so multi-line PEM private keys survive intact. The
      # values never touch the runner's filesystem, and they
      # never enter the GH Actions secret context (so PRs from
      # forks on this public repo can't read them).
      #
      # Placeholder detection: every parameter was provisioned
      # by infra/aws/bootstrap/secrets.tf with
      # value=PLACEHOLDER_SET_VIA_AWS_CLI; the bootstrap
      # `lifecycle.ignore_changes=[value]` keeps the operator's
      # real value intact across subsequent applies. The sanity
      # check below fails fast if any value still equals the
      # placeholder, so a misconfigured operator gets a clear
      # one-time-setup error rather than a confusing
      # "GitHub App auth failed" deep inside the Lambda at
      # runtime.
      #
      # Issue #126: this step is AWS-only. The Alicloud path
      # uses the operator's `alicloud.tfvars` (gitignored, copied
      # from `alicloud.tfvars.example`) directly via -var-file
      # in the `terraform plan` step above. The Phase 5
      # follow-up will add a KMS Secrets fetch (mirroring this
      # step) once the Aliyun OIDC role is provisioned in
      # infra/alicloud/bootstrap/deploy-role.tf.
      - name: Render TF_VAR_* env from SSM
        if: env.BLITZLOG_PROVIDER == 'aws'
        env:
          BLITZLOG_ENV: ${{ env.BLITZLOG_ENV }}
        run: |
          set -euo pipefail

          SSM_PATH="/blitzlog/${BLITZLOG_ENV}/"
          aws ssm get-parameters-by-path \
            --path "${SSM_PATH}" \
            --recursive \
            --with-decryption \
            --output json > /tmp/ssm-params.json

          # Fail fast if any required parameter is missing
          # entirely (operator hasn't run the bootstrap apply,
          # or added a TF var to variables.tf without adding the
          # corresponding SSM parameter to secrets.tf).
          for required in \
            aws-region vpc-id github-app-id \
            github-app-private-key github-app-installation-id \
            github-webhook-secret opencode-api-key \
            agent-logs-bucket-name; do
            if ! jq -e --arg n "${SSM_PATH}${required}" \
                 '.Parameters[] | select(.Name == $n)' /tmp/ssm-params.json > /dev/null; then
              echo "FATAL: ${SSM_PATH}${required} is not set in SSM" >&2
              echo "  Run 'cd infra/bootstrap && terraform apply' first," >&2
              echo "  then update the placeholder with:" >&2
              echo "    aws ssm put-parameter --name ${SSM_PATH}${required} --type SecureString --value <real> --overwrite" >&2
              exit 1
            fi
          done

          # Fail fast if any value is still the bootstrap
          # placeholder (operator hasn't replaced it yet).
          if placeholders=$(jq -r '.Parameters[] | select(.Value == "PLACEHOLDER_SET_VIA_AWS_CLI") | .Name' /tmp/ssm-params.json); [ -n "$placeholders" ]; then
            echo "FATAL: the following SSM parameters still have the bootstrap placeholder value:" >&2
            echo "$placeholders" | sed 's/^/  /' >&2
            echo "" >&2
            echo "  Update each one with the real value via:" >&2
            echo "    aws ssm put-parameter --name <name> --type SecureString --value <real> --overwrite" >&2
            echo "  See README §One-time operator setup for the full list." >&2
            exit 1
          fi

          # Render each parameter to GITHUB_ENV in heredoc form.
          # The mapping is:
          #   /blitzlog/<env>/github-app-private-key  ->  TF_VAR_github_app_private_key
          # (leaf name with hyphens replaced by underscores).
          # Heredoc form preserves multi-line PEM values.
          jq -r '
            .Parameters[] |
            (.Name | split("/") | last) as $leaf |
            "TF_VAR_" + ($leaf | gsub("-";"_")) + "<<EOF\n" + .Value + "\nEOF"
          ' /tmp/ssm-params.json >> "$GITHUB_ENV"

      # Backend config is passed inline so no `*.hcl` file is
      # materialized on the runner. The bucket comes from the
      # repo variable TF_BACKEND_BUCKET (with a default of
      # `gwc-infra-tf-state` so the standard install needs no
      # operator action; the variable exists for non-default
      # state buckets), the key is per-env
      # (<env>/blitzlog.tfstate), the region is hard-coded
      # ap-east-1 (matches the bootstrap role's trust policy).
      #
      # Issue #126: when BLITZLOG_PROVIDER=alicloud, the backend
      # switches from AWS S3 to Alicloud OSS. The state bucket
      # name comes from vars.TF_BACKEND_BUCKET_OSS (default
      # `gwc-infra-tfstate` so the standard install needs no
      # operator action), the region is hard-coded cn-hangzhou to
      # match the bootstrap role's trust policy.
      - name: terraform init
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/${{ env.BLITZLOG_ENV }}
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET || 'gwc-infra-tf-state' }}
          TF_BACKEND_BUCKET_OSS: ${{ vars.TF_BACKEND_BUCKET_OSS || 'gwc-infra-tfstate' }}
          BLITZLOG_PROVIDER: ${{ env.BLITZLOG_PROVIDER }}
        run: |
          set -euo pipefail
          if [ "${BLITZLOG_PROVIDER}" = "alicloud" ]; then
            terraform init -input=false \
              -backend-config="bucket=${TF_BACKEND_BUCKET_OSS}" \
              -backend-config="key=${{ env.STATE_KEY }}" \
              -backend-config="region=cn-hangzhou"
          else
            terraform init -input=false \
              -backend-config="bucket=${TF_BACKEND_BUCKET}" \
              -backend-config="key=${{ env.STATE_KEY }}" \
              -backend-config="region=ap-east-1"
          fi

      - name: terraform validate
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/${{ env.BLITZLOG_ENV }}
        run: terraform validate -no-color

      # Issue #126: pass the per-provider tfvars file. The naming
      # convention is `<provider>.tfvars` (e.g. `aws.tfvars` for the
      # AWS path, `alicloud.tfvars` for the Alicloud path). The
      # files are gitignored operator-side; the example file in the
      # same directory is the template.
      - name: terraform plan
        id: plan
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/${{ env.BLITZLOG_ENV }}
        env:
          BLITZLOG_PROVIDER: ${{ env.BLITZLOG_PROVIDER }}
        run: |
          set -euo pipefail
          # -out=tfplan serialises the plan to a file so the
          # apply step consumes the exact same plan (no drift
          # between plan and apply). -no-color keeps the log
          # readable in the GH Actions UI.
          TFVARS_FILE="${BLITZLOG_PROVIDER}.tfvars"
          if [ -f "${TFVARS_FILE}" ]; then
            terraform plan -no-color -input=false -var-file="${TFVARS_FILE}" -out=tfplan
          else
            echo "FATAL: ${TFVARS_FILE} not found in $(pwd). Copy the *.tfvars.example to ${TFVARS_FILE} and fill in the values." >&2
            exit 1
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.BLITZLOG_PROVIDER }}-${{ env.BLITZLOG_ENV }}
          path: infra/${{ env.BLITZLOG_PROVIDER }}/${{ env.BLITZLOG_ENV }}/tfplan
          # 14-day retention matches the issue body's plan
          # reusability goal (the plan is a snapshot, not a
          # long-lived artifact).
          retention-days: 14

      - name: terraform apply
        id: apply
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/${{ env.BLITZLOG_ENV }}
        # Always consumes the plan from the previous step; never
        # re-plans in-band. Keeps plan↔apply symmetric so a
        # reviewer looking at the artifact can be sure the apply
        # matches what they saw.
        run: terraform apply -no-color -input=false tfplan

      - name: Capture terraform output
        if: steps.apply.outcome == 'success'
        working-directory: infra/${{ env.BLITZLOG_PROVIDER }}/${{ env.BLITZLOG_ENV }}
        # `webhook_url` is the only output the operator needs
        # after a successful apply (it's the URL the GitHub App
        # webhook should target). Capture the full -json output
        # to the run summary so the operator can grep for any
        # other outputs without re-running plan/apply.
        run: |
          set -euo pipefail
          terraform output -no-color -json > /tmp/tf-output.json
          {
            echo "## Terraform output (${{ env.BLITZLOG_ENV }})"
            echo
            jq -r 'to_entries[] | "- **\(.key)**: `\(.value.value // "null")`"' /tmp/tf-output.json
          } >> "$GITHUB_STEP_SUMMARY"
