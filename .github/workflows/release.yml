name: release

on:
  push:
    tags: ['v*']
  # Manual trigger for testing on the PR branch (a v* tag on the PR
  # branch fires this workflow too, but workflow_dispatch is cheaper
  # and doesn't require bumping a tag).
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (e.g. fix/release-please-version-source). Defaults to the workflow's ref."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    env:
      IMAGE_NAME: blitzlog-agent
      REGISTRY: ghcr.io
      OWNER: great-wall-connect
      BUILD_REF: ${{ inputs.ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Derive version from tag
        id: version
        run: |
          # When triggered by push:tags:['v*'], GITHUB_REF_NAME is the tag
          # (e.g. "v0.1.1"). When triggered manually, the operator passes
          # `ref` explicitly. For local-PR testing we accept a tag-shaped
          # string; for branch testing we fall back to "0.0.0" so the
          # build still completes (the image tag will be "v0.0.0", which
          # is fine for a one-off test push).
          if [[ "${{ env.BUILD_REF }}" == v* ]]; then
            VERSION="${BUILD_REF#v}"
          else
            VERSION="0.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pin Python 3.12 via mise so the local-exec build step has
      # access to `python3.12` and `mise run build` resolves. The
      # `Build Lambda bundle` step calls `mise run build` which needs
      # this — without it, the runner image (ubuntu-26.04-arm) has no
      # `mise` binary and the build fails with "mise: command not
      # found" (run 37893092108 on the v0.1.1 tag failed this way).
      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        run: mise install

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Lambda bundle
        run: mise run build

      - name: Zip Lambda bundle for release asset
        run: (cd infra/build && zip -r ../blitzlog-lambda.zip .)

      - name: Build and push blitzlog-agent image
        uses: docker/build-push-action@v7
        with:
          context: ./packages/images/agent
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Image size gate
        run: |
          docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' \
            | awk '$1 ~ /GB/ { split($1, parts, "G"); if (parts[1] + 0 > 2.0) { print "REJECTED (too big): " $0; exit 1 } }'
          echo "Image size OK"

      - name: Upload Lambda zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_REF }}
          files: infra/blitzlog-lambda.zip
