name: release

# Manual release workflow. Triggered only via workflow_dispatch.
# The behavior is auto-detected from the dispatched ref:
#
#   - ref has an open PR             -> PR-test path:
#                                       * reads version from lambda/version.py
#                                       * auto-detects bump type from the
#                                         conventional commits in the PR's diff
#                                         via git-cliff (BREAKING CHANGE:/
#                                         feat!:/feat(...):/fix:/
#                                         default = major/minor/minor/patch)
#                                       * builds and pushes the agent image
#                                         with tag v{X}-pr{N} (no :latest)
#                                       * bakes a dev AMI from that image and
#                                         publishes its id to
#                                         /blitzlog/dev/agent-ami-id-docker-ubuntu
#                                       * posts a PR comment describing the
#                                         build (fails loudly if no PR is
#                                         found)
#                                       * does NOT touch the source
#
#   - ref has no open PR (main,
#     release/*, etc.)               -> Release path:
#                                       * reads current version
#                                       * auto-detects bump type from the
#                                         conventional commits in the diff
#                                         range (last release tag -> ref)
#                                         via git-cliff
#                                       * updates lambda/version.py
#                                       * commits with [skip ci]
#                                       * pushes (with fallback to a
#                                         release/vX.Y.Z-<ts> branch +
#                                         gh pr create if direct push
#                                         to BUILD_REF fails)
#                                       * builds and pushes the agent image
#                                         with tags v{X} + :latest
#                                       * bakes a prod AMI from that image
#                                         and publishes its id to
#                                         /blitzlog/prod/agent-ami-id-docker-ubuntu
#                                       * tags v{X} and pushes the tag
#                                       * uploads the Lambda zip to a
#                                         GitHub Release
#
# The operator runs ONE of:
#   gh workflow run release.yml --ref fix/issue-110-foo
#   gh workflow run release.yml --ref main
#
# Packer integration added by issue #91: the previous local `packer build`
# step is gone; everything goes through this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build from. Mode is auto-detected: open PR for the ref -> PR-test (image only); no open PR -> Release (bump source + commit + tag)."
        required: false
        type: string

permissions:
  contents: write
  packages: write
  # Required for the fallback "create release branch + open PR" path
  # in the Bump step.
  pull-requests: write
  # Required for OIDC into blitzlog-packer-build-role when baking the
  # AMI in the Packer build steps below.
  id-token: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-26.04-arm
    # 35 min covers worst case: docker build ~5min + Packer ~12min + tag
    # push + Lambda zip + buffer. The Packer bake was added in #91 and
    # grew the budget from the previous 20min.
    timeout-minutes: 35

    env:
      IMAGE_NAME: blitzlog-agent
      REGISTRY: ghcr.io
      OWNER: great-wall-connect
      BUILD_REF: ${{ inputs.ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          fetch-tags: true

      # Decide the mode (pr-test vs release) by whether $BUILD_REF has
      # an open PR. The bump type is auto-detected from the conventional
      # commits in the diff (last release tag -> $BUILD_REF) via
      # git-cliff (a battle-hardened conventional-commits parser). The
      # single dispatch input is `ref`; everything else is computed.
      - name: Detect mode and bump type
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Install git-cliff. The Detect step uses `git-cliff
          # --bumped-version` to compute the new version from the
          # conventional commits since the last v* tag. git-cliff
          # correctly handles all edge cases (BREAKING CHANGE: in
          # body, `feat!:` subject, post-breaking fix: commits, etc.)
          # — which is the correctness we couldn't get from a
          # hand-rolled bash parser or from cocogitto 7.0.0's
          # `--auto` flag.
          #
          # Pinned to a specific release rather than `/latest/` so the
          # runner is hermetic; bump CLIFF_VERSION here when upgrading.
          #
          # URL notes (verified against the actual GitHub release):
          # - git-cliff tags use the `v` prefix (`v2.14.2`), so the
          #   download path is `releases/download/v${CLIFF_VERSION}/...`
          #   (without the `v` would 404).
          # - Asset name embeds the version AND the target triple.
          #   The runner is `ubuntu-26.04-arm` (ARM64, glibc), so we
          #   download the `aarch64-unknown-linux-gnu` tarball.
          CLIFF_VERSION="2.14.2"
          # The tarball's top-level directory is `git-cliff-${CLIFF_VERSION}/`,
          # with the binary at `git-cliff-${CLIFF_VERSION}/git-cliff`. Use
          # --strip-components=1 to drop the leading directory and extract
          # `git-cliff` (plus the LICENSE files) directly into /usr/local/bin.
          curl -fsSL \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin
          git-cliff --version

          # Mode: open PR on $BUILD_REF -> pr-test, else release.
          PR_NUMBER=$(gh pr list --state open \
            --head "${{ env.BUILD_REF }}" \
            --json number --jq '.[0].number' || true)
          if [ -n "$PR_NUMBER" ]; then
            MODE=pr-test
          else
            MODE=release
          fi

          # Bump type: ask git-cliff. It reads the conventional commits
          # since the last v* tag and outputs the next SemVer on stdout.
          # Fail loud if no v* tag is reachable.
          LAST_TAG=$(git describe --tags --abbrev=0 "${{ env.BUILD_REF }}" 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "FATAL: no v* release tag reachable from ${{ env.BUILD_REF }}; cannot determine bump base." >&2
            echo "  If this is the first release, push a v0.1.1 tag manually first." >&2
            exit 1
          fi
          BUMP_BASE="${LAST_TAG#v}"

          # git-cliff's --bumped-version prints the next SemVer for
          # the unreleased commits (everything since the last v* tag)
          # on stdout, with the same prefix as the previous tag
          # (so for a `v0.1.1` tag, it returns `v0.1.2`). We don't
          # let git-cliff write to disk or create commits — the Bump
          # step below does the file update + commit + tag explicitly
          # so the workflow's behavior is fully visible and testable.
          # Strip the `v` prefix so the regex below is a plain SemVer.
          NEW_VERSION=$(git-cliff --bumped-version 2>/dev/null | tail -1 | sed 's/^v//')
          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FATAL: git-cliff did not return a semver: '$NEW_VERSION'" >&2
            exit 1
          fi

          # Derive bump type from the version-component diff.
          IFS=. read -r CUR_MAJOR CUR_MINOR CUR_PATCH <<< "$BUMP_BASE"
          IFS=. read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW_VERSION"
          if   [ "$NEW_MAJOR" -gt "$CUR_MAJOR" ]; then BUMP=major
          elif [ "$NEW_MINOR" -gt "$CUR_MINOR" ]; then BUMP=minor
          else                                        BUMP=patch
          fi

          # ALIGNMENT INVARIANT: the last v* tag's version must equal
          # the literal in lambda/version.py. Catches drift where
          # someone tags or bumps one without the other, before the
          # Bump step makes any changes. Pinned by
          # tests/test_release_workflow.py::test_detect_step_aligns_tag_and_version_file.
          FILE_VERSION=$(grep -E '^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' lambda/version.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -1)
          if [ -n "$FILE_VERSION" ] && [ "$FILE_VERSION" != "$BUMP_BASE" ]; then
            echo "FATAL: tag/version drift — last v* tag is v$BUMP_BASE but lambda/version.py says $FILE_VERSION" >&2
            echo "  Reconcile them (re-tag or re-bump the file) and re-run." >&2
            exit 1
          fi

          echo "Resolved current version: $BUMP_BASE (from $LAST_TAG)"
          echo "Detected bump type: $BUMP"
          echo "Computed new version: $NEW_VERSION"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install mise
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        run: mise install

      - name: Set up QEMU
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Lambda bundle
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        run: mise run build

      - name: Zip Lambda bundle for release asset
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        run: (cd infra/build && zip -r ../blitzlog-lambda.zip .)

      # Build and push the agent image. The tag depends on the mode:
      #   pr-test  -> v{new_version}-pr{N}  (e.g. v0.1.1-pr107)
      #   release -> v{new_version} + :latest
      #
      # NOTE: the tag formula here MUST match the AGENT_IMAGE_TAG
      # computed in the "Resolve Packer vars" step below — Packer
      # bakes exactly this image tag into the AMI.
      - name: Build and push blitzlog-agent image
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        env:
          IMAGE_TAG: ${{ steps.detect.outputs.new_version }}
          SUFFIX_TO_USE: ${{ steps.detect.outputs.mode == 'pr-test' && format('-pr{0}', steps.detect.outputs.pr_number) || '' }}
        run: |
          set -euo pipefail
          IMAGE_BASE="${REGISTRY}/${OWNER}/${IMAGE_NAME}:v${IMAGE_TAG}${SUFFIX_TO_USE}"
          IMAGE_LATEST="${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest"
          echo "Pushing: $IMAGE_BASE"
          if [ "${{ steps.detect.outputs.mode }}" = "release" ]; then
            echo "Also pushing: $IMAGE_LATEST"
            docker buildx build \
              --push \
              --platform linux/arm64 \
              -t "$IMAGE_BASE" \
              -t "$IMAGE_LATEST" \
              ./packages/images/agent
          else
            docker buildx build \
              --push \
              --platform linux/arm64 \
              -t "$IMAGE_BASE" \
              ./packages/images/agent
          fi

      # ----------------------------------------------------------------
      # Bake the AMI from the image we just pushed (issue #91).
      #
      # The Packer pipeline (infra/packer/agent-docker-ubuntu.pkr.hcl)
      # already publishes the AMI id to /blitzlog/<env>/agent-ami-id-
      # docker-ubuntu via its shell-local post-processor; we just need
      # to map mode -> Packer `environment`:
      #
      #   pr-test  -> environment=dev   -> /blitzlog/dev/... (dev agents)
      #   release -> environment=prod  -> /blitzlog/prod/... (prod agents)
      #
      # agent_image_tag MUST match the IMAGE_BASE tag above (the one
      # that was just pushed); see the NOTE on the build step.
      # ----------------------------------------------------------------

      - name: Install Packer
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: hashicorp/setup-packer@v2
        # v2 of hashicorp/setup-packer renamed the input from
        # `packer_version` (v1) to `version`. Passing the old name fails
        # the step with "Unexpected input(s) 'packer_version', valid
        # inputs are ['version']" before any Packer command runs.
        with:
          version: 1.16.1

      - name: Configure AWS credentials (OIDC) for Packer
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # OIDC into the role that infra/bootstrap/packer-role.tf
          # provisions. Trust policy already covers any branch of
          # great-wall-connect/blitzlog. vars.AWS_ACCOUNT_ID must
          # be set at the repo or org level before this runs.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/blitzlog-packer-build-role
          aws-region: ap-east-1

      - name: Resolve Packer vars from mode
        id: packer-vars
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        env:
          MODE: ${{ steps.detect.outputs.mode }}
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          PR_NUMBER: ${{ steps.detect.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "pr-test" ]; then
            # PR mode -> dev env (PR images get baked into the dev AMI;
            # last-writer-wins on /blitzlog/dev/agent-ami-id-docker-ubuntu).
            BLITZLOG_ENV=dev
            STT_BUCKET=blitzlog-dev-stt-models
            AGENT_IMAGE_TAG="v${NEW_VERSION}-pr${PR_NUMBER}"
            SSM_PATH="/blitzlog/dev/agent-ami-id-docker-ubuntu"
          else
            # release mode -> prod env
            BLITZLOG_ENV=prod
            STT_BUCKET=blitzlog-prod-stt-models
            AGENT_IMAGE_TAG="v${NEW_VERSION}"
            SSM_PATH="/blitzlog/prod/agent-ami-id-docker-ubuntu"
          fi
          echo "blitzlog_env=$BLITZLOG_ENV"      >> "$GITHUB_OUTPUT"
          echo "stt_bucket=$STT_BUCKET"          >> "$GITHUB_OUTPUT"
          echo "agent_image_tag=$AGENT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "ssm_path=$SSM_PATH"              >> "$GITHUB_OUTPUT"

      - name: Packer init
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        working-directory: infra/packer
        run: packer init agent-docker-ubuntu.pkr.hcl

      - name: Packer build (bake AMI, publish id to SSM)
        id: packer
        if: steps.detect.outputs.mode == 'pr-test' || steps.detect.outputs.mode == 'release'
        working-directory: infra/packer
        env:
          BLITZLOG_ENV: ${{ steps.packer-vars.outputs.blitzlog_env }}
          STT_BUCKET: ${{ steps.packer-vars.outputs.stt_bucket }}
          AGENT_IMAGE_TAG: ${{ steps.packer-vars.outputs.agent_image_tag }}
          # GITHUB_TOKEN is consumed by 03-bake-images.sh to `docker login
          # ghcr.io` before pulling the blitzlog-agent image. Empty when
          # the secret isn't set; the script warns and the pull fails.
          GH_TOKEN_FOR_PACKER: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # -force skips the "Do you want to proceed?" prompt that Packer
          # emits in non-TTY / non-CI-detected contexts. Safe here because
          # the build is operator-dispatched and the packer-role's IAM
          # already gates what the build can do.
          packer build -force \
              -var "environment=${BLITZLOG_ENV}" \
              -var "agent_image_tag=${AGENT_IMAGE_TAG}" \
              -var "stt_models_bucket=${STT_BUCKET}" \
              -var "github_token=${GH_TOKEN_FOR_PACKER}" \
              -var-file docker-images.pkrvars.hcl \
              agent-docker-ubuntu.pkr.hcl
          # Packer writes manifest.json (via the `manifest` post-processor
          # in agent-docker-ubuntu.pkr.hcl) with the build's artifact_id
          # in the form "<region>:ami-<id>". The same source of truth the
          # 05-publish-ami-id.sh post-processor reads from.
          if [ ! -r manifest.json ]; then
            echo "FATAL: Packer did not write manifest.json (build may have failed before the post-processor ran)" >&2
            exit 1
          fi
          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | awk -F: '{print $2}')
          if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "null" ]; then
            echo "FATAL: could not extract AMI id from manifest.json:" >&2
            jq . manifest.json | sed 's/^/    /' >&2
            exit 1
          fi
          echo "Baked AMI: $AMI_ID"
          echo "Published to ${{ steps.packer-vars.outputs.ssm_path }} via the Packer post-processor (05-publish-ami-id.sh)."
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      # PR-test-only: post a PR comment describing the build. Fails loudly
      # if no open PR is found on $BUILD_REF (we already detected this
      # in the Detect step; here we re-check and emit a clear error).
      - name: Post PR-test release comment
        if: steps.detect.outputs.mode == 'pr-test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.detect.outputs.pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "FATAL: pr-test mode requires an open PR for ${{ env.BUILD_REF }}" >&2
            exit 1
          fi
          IMAGE_TAG="v${{ steps.detect.outputs.new_version }}-pr${PR_NUMBER}"
          NEW_VERSION="${{ steps.detect.outputs.new_version }}"
          BUMP="${{ steps.detect.outputs.bump }}"
          CURRENT=$(grep -E '^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' lambda/version.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          AMI_ID="${{ steps.packer.outputs.ami_id }}"
          SSM_PATH="${{ steps.packer-vars.outputs.ssm_path }}"
          COMMENT_BODY="## Release PR-test output"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Current version (lambda/version.py): \`${CURRENT}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Bump type (auto-detected by git-cliff from conventional commits): \`${BUMP}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- New version: \`${NEW_VERSION}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Image tag: \`${IMAGE_TAG}\`"
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="- Image registry: \`${REGISTRY}/${OWNER}/${IMAGE_NAME}:${IMAGE_TAG}\`"
          COMMENT_BODY+=$'\n'
          if [ -n "$AMI_ID" ]; then
            COMMENT_BODY+="- AMI id: \`${AMI_ID}\`"
            COMMENT_BODY+=$'\n'
            COMMENT_BODY+="- SSM param (dev): \`${SSM_PATH}\`"
            COMMENT_BODY+=$'\n'
          fi
          COMMENT_BODY+=$'\n'
          COMMENT_BODY+="The image is built and pushed with the bumped version, and a dev AMI has been baked from it. Source is NOT modified by this run. To land this version on the canonical release branch, run this workflow against \`main\` (or a release branch) — the mode auto-detects from the ref's open-PR status."
          gh pr comment "${PR_NUMBER}" --body "${COMMENT_BODY}" || true

      # Release-only: bump lambda/version.py, commit, push (with
      # fallback to release branch + gh pr create if direct push to
      # BUILD_REF fails), then tag. lambda/version.py is the only
      # source of truth — no manifest file to keep in sync.
      - name: Bump version in source (release only)
        if: steps.detect.outputs.mode == 'release'
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.detect.outputs.new_version }}"
          sed -i -E "s/^__version__\\s*=\\s*\"([0-9]+\\.[0-9]+\\.[0-9]+)\"/__version__ = \"${NEW_VERSION}\"/" lambda/version.py
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add lambda/version.py
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]"

          # Try direct push to BUILD_REF. If that succeeds, that's the
          # ref the Tag step will use. If it fails (typical for `main`
          # with branch protection), create a release branch + open a
          # PR; the release branch becomes the ref the Tag step uses.
          if git push origin "${{ env.BUILD_REF }}"; then
            echo "release_ref=${{ env.BUILD_REF }}" >> "$GITHUB_OUTPUT"
          else
            echo "WARN: direct push to ${{ env.BUILD_REF }} failed (likely branch protection); falling back to release branch + PR" >&2
            RELEASE_BRANCH="release/v${NEW_VERSION}-$(date +%s)"
            git checkout -b "$RELEASE_BRANCH"
            git push origin "$RELEASE_BRANCH"
            gh pr create \
              --base "${{ env.BUILD_REF }}" \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): ${NEW_VERSION}" \
              --body "Automated release PR.\n\nBumps \`lambda/version.py\` to ${NEW_VERSION}.\n\nMerge to trigger the release image build via the canonical v* tag path." \
              --label "release" || true
            echo "release_ref=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      # Release-only: tag the release. Consumes the Bump step's
      # `release_ref` output. The `if: steps.detect.outputs.mode == ...`
      # is already enforced via this step's gate on Bump.
      - name: Tag the release (release only)
        if: steps.detect.outputs.mode == 'release' && steps.bump.outputs.release_ref
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.detect.outputs.new_version }}"
          git checkout "${{ steps.bump.outputs.release_ref }}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      # Release-only: upload the Lambda zip to a GitHub Release tagged
      # v{new_version}. The image-build step already pushed the image
      # with :latest.
      - name: Upload Lambda zip to release
        if: steps.detect.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.detect.outputs.new_version }}
          files: infra/blitzlog-lambda.zip
