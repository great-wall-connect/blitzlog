name: release

# Manual release workflow. Triggered only via workflow_dispatch with a
# `mode` input. There is no automatic tag-push trigger — every release
# is an explicit operator action.
#
# Two modes:
#   - pr-test:   Build the agent image from a PR branch ref, tag it
#                 `{version}-rc1` (e.g. `0.1.0-rc1`), push to GHCR.
#                 No source modification, no :latest push, no git tag.
#                 Use this to test a PR's image before merging.
#   - release:   Build the agent image from a branch ref, tag it
#                 `v{version}` + `:latest`, push to GHCR, update
#                 `lambda/version.py` and `.release-please-manifest.json`
#                 on that ref to the new version, commit, and create
#                 a git tag `v{version}`. Use this as the canonical
#                 release flow.
#
# Both modes read the version from `lambda/version.py` at the chosen
# ref (with `.release-please-manifest.json` as a fallback). If neither
# source has a parseable version, the workflow hard-fails — the
# operator is expected to investigate (e.g. release-please's
# dry-run output, which is captured in the step log).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "'pr-test' for a PR image with rc1 suffix; 'release' for a main release (modifies source)."
        required: true
        type: choice
        options: [pr-test, release]
      ref:
        description: "Branch to build from. Defaults to the workflow's ref_name (the tag for a push trigger, the PR branch for pr-test dispatch, main for release dispatch)."
        required: false
        type: string
      suffix:
        description: "Image tag suffix appended after the version (default 'rc1'). Ignored when mode=release."
        required: false
        type: string
        default: "rc1"

permissions:
  contents: write
  packages: write
  # Required for the fallback "create release branch + open PR" path
  # in the Bump step.
  pull-requests: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    env:
      IMAGE_NAME: blitzlog-agent
      REGISTRY: ghcr.io
      OWNER: great-wall-connect
      BUILD_REF: ${{ inputs.ref || github.ref_name }}
      MODE: ${{ inputs.mode }}
      SUFFIX: ${{ inputs.suffix || 'rc1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      # The version is read from `lambda/version.py` at the chosen ref,
      # with `.release-please-manifest.json` as a fallback. The
      # `release-please` CLI's `--dry-run` mode is the canonical way
      # to compute the next version without opening a PR, but a manual
      # patch bump is the fallback if the dry-run output is
      # unparseable.
      - name: Read version
        id: version
        run: |
          set -euo pipefail

          VERSION=""

          # Try the manifest first (canonical source of truth per
          # release-please's own config). The manifest key is
          # `lambda/`.
          if [ -f .release-please-manifest.json ]; then
            VERSION=$(python3 - <<'PY'
          import json, re, sys
          try:
              with open(".release-please-manifest.json") as f:
                  m = json.load(f)
              for v in m.values():
                  if isinstance(v, str) and re.match(r"^\d+\.\d+\.\d+$", v):
                      print(v)
                      sys.exit(0)
          except Exception as e:
              print(f"manifest parse failed: {e}", file=sys.stderr)
          sys.exit(1)
          PY
            )
          fi

          # Fallback: read from `lambda/version.py`. The literal is
          # `__version__ = "X.Y.Z"` on a single line.
          if [ -z "$VERSION" ] && [ -f lambda/version.py ]; then
            VERSION=$(grep -E '^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' lambda/version.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -1)
          fi

          # Last resort: manual patch bump of whatever the current
          # version is. If even that fails, hard-fail the build.
          if [ -z "$VERSION" ]; then
            CURRENT=$(grep -E '^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' lambda/version.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' | head -1 || true)
            if [ -n "$CURRENT" ]; then
              IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
              VERSION="$MAJOR.$MINOR.$((PATCH+1))"
              echo "manually bumped $CURRENT -> $VERSION"
            else
              echo "FATAL: could not read a parseable version from .release-please-manifest.json or lambda/version.py at ref ${{ env.BUILD_REF }}" >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install Python toolchain
        run: mise install

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Lambda bundle
        run: mise run build

      - name: Zip Lambda bundle for release asset
        run: (cd infra/build && zip -r ../blitzlog-lambda.zip .)

      # Release-mode-only: attach the zip to a GitHub Release. The
      # `tag_name` uses the resolved version (from `Read version`),
      # not the workflow's ref_name. The gate ensures the pr-test
      # path doesn't accidentally publish a draft release asset.
      - name: Upload Lambda zip to release
        if: env.MODE == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: infra/blitzlog-lambda.zip

      # The image tag is constructed from MODE:
      #   pr-test -> v{version}-{suffix}      (e.g. v0.1.0-rc1)        ; no :latest
      #   release -> v{version} + :latest     (e.g. v0.1.0 + :latest)
      #
      # The conditional in the tags block makes the second line a no-op
      # in pr-test mode, so :latest is not pushed on pr-test runs.
      - name: Build and push blitzlog-agent image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          SUFFIX_TO_USE: ${{ env.MODE == 'pr-test' && format('-{0}', env.SUFFIX) || '' }}
        run: |
          set -euo pipefail
          IMAGE_BASE="${REGISTRY}/${OWNER}/${IMAGE_NAME}:v${IMAGE_TAG}${SUFFIX_TO_USE}"
          IMAGE_LATEST="${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest"
          echo "Pushing: $IMAGE_BASE"
          if [ "${{ env.MODE }}" = "release" ]; then
            echo "Also pushing: $IMAGE_LATEST"
            docker buildx build \
              --push \
              --platform linux/arm64 \
              -t "$IMAGE_BASE" \
              -t "$IMAGE_LATEST" \
              ./packages/images/agent
          else
            docker buildx build \
              --push \
              --platform linux/arm64 \
              -t "$IMAGE_BASE" \
              ./packages/images/agent
          fi

      # Release-mode-only: update the version literal in lambda/version.py
      # and the manifest, commit, push, then create the git tag and
      # push it. The [skip ci] in the commit message prevents the test
      # workflow from re-firing on the version-bump commit.
      #
      # If the direct push to BUILD_REF fails (typically because
      # BUILD_REF is `main` and main is protected against direct
      # pushes), fall back to: create a `release/vX.Y.Z-<ts>` branch,
      # push the bump commit to it, and open a PR back to BUILD_REF.
      # The Tag step below uses the `release_ref` output to know which
      # branch/commit to tag.
      - name: Bump version in source (release mode only)
        if: env.MODE == 'release'
        id: bump
        run: |
          set -euo pipefail
          sed -i -E "s/^__version__\\s*=\\s*\"([0-9]+\\.\\d+\\.\\d+)\"/__version__ = \"${{ steps.version.outputs.version }}\"/" lambda/version.py
          python3 -c "import json; p='.release-please-manifest.json'; d=json.load(open(p)); d['lambda/']='${{ steps.version.outputs.version }}'; json.dump(d, open(p,'w'), indent=2); open(p,'a').write('\\n')"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add lambda/version.py .release-please-manifest.json
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip ci]"

          # Try direct push to BUILD_REF. If that succeeds, that's the
          # ref the Tag step will use. If it fails (typical for `main`
          # with branch protection), create a release branch + open a
          # PR; the release branch becomes the ref the Tag step uses.
          if git push origin "${{ env.BUILD_REF }}"; then
            echo "release_ref=${{ env.BUILD_REF }}" >> "$GITHUB_OUTPUT"
          else
            echo "WARN: direct push to ${{ env.BUILD_REF }} failed (likely branch protection); falling back to release branch + PR" >&2
            RELEASE_BRANCH="release/v${{ steps.version.outputs.version }}-$(date +%s)"
            git checkout -b "$RELEASE_BRANCH"
            git push origin "$RELEASE_BRANCH"
            gh pr create \
              --base "${{ env.BUILD_REF }}" \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): ${{ steps.version.outputs.version }}" \
              --body "Automated release PR.\n\nBumps \`lambda/version.py\` to ${{ steps.version.outputs.version }} and updates \`.release-please-manifest.json\`.\n\nMerge to trigger the release image build via the canonical v* tag path." \
              --label "release" || true
            echo "release_ref=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release (release mode only)
        if: env.MODE == 'release'
        needs: bump
        run: |
          set -euo pipefail
          # Make sure we're on the ref that holds the bump commit (which
          # is either BUILD_REF, direct-pushed, or the fallback release
          # branch we just created). git tag attaches to the current
          # branch's tip.
          git checkout "${{ steps.bump.outputs.release_ref }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
