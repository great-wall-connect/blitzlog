name: oidc-claims

# TEMPORARY diagnostic workflow: prints the GitHub OIDC token's
# claims so the Alicloud trust policy's conditions can be matched
# against what the token actually carries. Delete once the trust
# policy is right.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the OIDC claims
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.aliyuncs.com"
          req = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print("OIDC CLAIMS:", json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          PY
