name: docker-images

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/images/agent/**"
      - ".github/workflows/docker-images.yml"
  # Operator path for building + pushing an agent image on demand, used
  # by the dev-AMI test workflow (Packer pulls this tag into the AMI).
  # release.yml's v*-tag path covers release publishing — these two
  # publish paths coexist deliberately. The shape was deleted in PR #94
  # (commit 0990238) as part of the SemVer work and is being restored
  # here so `gh workflow run docker-images.yml -f image_tag=<tag>` works
  # again for ad-hoc PR image testing.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. pr-100-final). Defaults to 'latest'."
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build blitzlog-agent image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    env:
      IMAGE_NAME: blitzlog-agent
      REGISTRY: ghcr.io
      OWNER: great-wall-connect
      # Default to "latest" for dispatch; PR runs don't reference this.
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
      # The tag the image was actually built under. The PR build pushes
      # no image but still loads one locally under a `pr-N` tag; the
      # dispatch build pushes under IMAGE_TAG. The smoke-test step
      # below needs the real tag, and step-level `env` does not
      # propagate between steps — hence job level.
      BUILT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || format('pr-{0}', github.event.pull_request.number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log into GHCR before any push step. The PR-time build doesn't
      # push, so it skips login; workflow_dispatch and other non-PR
      # triggers run it. Without this, buildx falls back to anonymous
      # auth and GHCR returns 403 on the anonymous-token endpoint for
      # packages the workflow has never published before.
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        uses: docker/build-push-action@v7
        with:
          context: ./packages/images/agent
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Build and push (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: ./packages/images/agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Image size gate
        run: |
          docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' \
            | awk '$1 ~ /GB/ { split($1, parts, "G"); if (parts[1] + 0 > 2.0) { print "REJECTED (too big): " $0; exit 1 } }'
          echo "Image size OK"

      # Issue #164/#174: the image must boot with the documented
      # capability set and writable paths, and it must be able to
      # install a package — a project's `bootstrap` task does exactly
      # that, and it is how the agent got stuck after #164. The smoke
      # test asserts the effective capability mask, that the image ships
      # no compiler, and that `apt-get install` works inside the
      # container. A static test cannot prove any of that, so the
      # container is actually run here.
      #
      # The flags come from the canonical hardening contract, so CI
      # exercises exactly the posture production uses.
      #
      # The gh-config bind mount is NOT optional: it is what makes the
      # container's $HOME/.config a Docker-created, root-owned
      # directory (Docker creates the missing parent of a bind mount as
      # root:root 0755). Without that mount the agent's config dir is
      # created by the agent itself and the failure mode below is
      # invisible — which is exactly how a broken image got
      # merged: CI was green, and the first real run died with
      #
      #   mkdir: cannot create directory '/home/blitzlog/.config/opencode':
      #   Permission denied
      #
      # because only production mounted a gh config under $HOME/.config.
      # Mounting it here reproduces the production mount topology.
      - name: Smoke test under the hardening flags
        run: |
          . packages/images/agent/container-hardening.env
          mkdir -p "$RUNNER_TEMP/gh-config"
          printf 'github.com:\n    oauth_token: smoke-test-not-a-real-token\n    git_protocol: https\n' \
            > "$RUNNER_TEMP/gh-config/hosts.yml"
          docker run --rm $BLITZLOG_HARDENING_FLAGS $BLITZLOG_TMPFS_MOUNTS \
            --entrypoint="" \
            -v "$PWD/packages/images/agent/smoke-test.sh:/smoke-test.sh:ro" \
            -v "$RUNNER_TEMP/gh-config:${BLITZLOG_CONTAINER_HOME}/.config/gh:ro" \
            "${REGISTRY}/${OWNER}/${IMAGE_NAME}:${BUILT_TAG}" \
            sh /smoke-test.sh
