name: docker-images

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/images/agent/**"
      - ".github/workflows/docker-images.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build blitzlog-agent image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    env:
      IMAGE_NAME: blitzlog-agent
      REGISTRY: ghcr.io
      OWNER: great-wall-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (PR — no push)
        uses: docker/build-push-action@v7
        with:
          context: ./packages/images/agent
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Image size gate
        run: |
          docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' \
            | awk '$1 ~ /GB/ { split($1, parts, "G"); if (parts[1] + 0 > 2.0) { print "REJECTED (too big): " $0; exit 1 } }'
          echo "Image size OK"